  <style>
    :root {
      --ue-red: #E30613;
      --ue-red-dark: #B8000B;
      --rm-navy: #060E1E;
      --rm-navy-mid: #0C1B33;
      --rm-blue: #001A57;
      --rm-gold: #FEBE10;
      --rm-gold-dark: #D97706;
      --nutri-teal: #0D9488;
      --tfg-indigo: #4F46E5;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #F4F6FA;
      background-image:
        radial-gradient(at 0% 0%, rgba(227, 6, 19, 0.04) 0px, transparent 45%),
        radial-gradient(at 100% 0%, rgba(0, 26, 87, 0.06) 0px, transparent 50%);
      color: #0B1528;
      margin: 0;
      padding: 0;
    }
    .font-mono-tech {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Native <dialog> scroll containment per modern-web-guidance (prevent-page-scroll-under-modal-dialog) */
    dialog:modal {
      overscroll-behavior: contain;
      border: none;
      padding: 0;
      background: transparent;
      max-width: 100vw;
      max-height: 100dvh;
    }
    dialog::backdrop {
      overflow: hidden;
      overscroll-behavior: contain;
      background: rgba(6, 14, 30, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Futuristic subtle scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(12, 27, 51, 0.18); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(227, 6, 19, 0.5); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      50% { transform: scale(1.15); opacity: 0.85; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    }
    .live-dot { animation: pulse-glow 2s infinite ease-in-out; }

    @keyframes spin-smooth {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-active { animation: spin-smooth 0.9s linear infinite; }

    /* Futuristic glass cards */
    .ue-glass-header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .ue-dark-glass {
      background: linear-gradient(135deg, #060E1E 0%, #0C1B33 60%, #001A57 100%);
    }
    .ue-card {
      background: #FFFFFF;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 4px 20px -2px rgba(6, 14, 30, 0.05);
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.18s ease;
    }
    .ue-card-interactive:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -6px rgba(6, 14, 30, 0.12);
      border-color: rgba(0, 26, 87, 0.22);
    }

    /* Interactive Tooltip for Sportswear (Ropa Deportiva) */
    .sportswear-Wrap { position: relative; display: inline-flex; }
    .sportswear-Tip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      transform: translateY(4px);
      background: #060E1E;
      color: #FFFFFF;
      border: 1px solid #FEBE10;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      z-index: 80;
      box-shadow: 0 12px 28px -4px rgba(6, 14, 30, 0.55);
      transition: all 0.16s ease;
      pointer-events: none;
    }
    .sportswear-Wrap:hover .sportswear-Tip,
    .sportswear-Wrap:focus-within .sportswear-Tip {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

    async function parseXlsxBinaryNative(arrayBuffer) {

        const compSize = view.getUint32(ptr + 20, true);
        const uncompSize = view.getUint32(ptr + 24, true);
        const nameLen = view.getUint16(ptr + 28, true);
        const extraLen = view.getUint16(ptr + 30, true);
        const commentLen = view.getUint16(ptr + 32, true);
        const localHeaderOffset = view.getUint32(ptr + 42, true);

        const extraLen = view.getUint16(lh + 28, true);
        const dataStart = lh + 30 + fnameLen + extraLen;
        const rawSlice = bytes.subarray(dataStart, dataStart + info.compSize);
        if (info.method === 0) return decoder.decode(rawSlice);

        const writer = ds.writable.getWriter();
        writer.write(rawSlice);

        }
        for (const m of relsXml.matchAll(/<Relationship\s+[^>]*?Target="([^"]+)"[^>]*?Id="([^"]+)"/g)) {
          relMap[m[2]] = m[1].replace(/^\//, '').replace(/^(?!xl\/)/, 'xl/');
        }
      }

      const sheetsList = [];
      if (wbXml) {
        for (const m of wbXml.matchAll(/<sheet\s+[^>]*?name="([^"]+)"[^>]*?r:id="([^"]+)"/g)) {
          sheetsList.push({ name: decodeXmlEntities(m[1]), rId: m[2] });
        }
      }

      function colToIdx(colStr) {
        let n = 0;
        for (let i = 0; i < colStr.length; i++) n = n * 26 + (colStr.charCodeAt(i) - 64);
        return n - 1;
      }

      function parseRef(ref) {
        const m = /^([A-Z]+)(\d+)$/.exec(ref);
        if (!m) return { r: 0, c: 0 };
        return { c: colToIdx(m[1]), r: parseInt(m[2], 10) - 1 };
      }

      function excelSerialToDateOrTime(num) {
        if (!Number.isFinite(num)) return String(num);
        if (num >= 0 && num < 1.0) {
          const totalMins = Math.round(num * 24 * 60);
          const hh = String(Math.floor(totalMins / 60) % 24).padStart(2, '0');
          const mm = String(totalMins % 60).padStart(2, '0');
          return `${hh}:${mm}`;
        }
        if (num > 36000 && num < 75000) {
          const utcMs = Math.round((num - 25569) * 86400 * 1000);
          return new Date(utcMs).toISOString().slice(0, 10);
        }
        return String(num);
      }

      const result = {};
      for (let idx = 0; idx < sheetsList.length; idx++) {
        const s = sheetsList[idx];
        const targetPath = relMap[s.rId] || `xl/worksheets/sheet${idx + 1}.xml`;
        const sheetXml = await extractText(targetPath);
        if (!sheetXml) continue;

        const merges = [];
        for (const mm of sheetXml.matchAll(/<mergeCell\s+ref="([A-Z]+\d+):([A-Z]+\d+)"/g)) {
          merges.push({ s: parseRef(mm[1]), e: parseRef(mm[2]) });
        }

        const rowsMap = new Map();
        let maxRow = 0;
        for (const rm of sheetXml.matchAll(/<row\s+[^>]*?r="(\d+)"[^>]*?>([\s\S]*?)<\/row>/g)) {
          const rIdx = parseInt(rm[1], 10) - 1;
          if (rIdx + 1 > maxRow) maxRow = rIdx + 1;
          const rowBody = rm[2];
          const cells = [];
          for (const cm of rowBody.matchAll(/<c\s+([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
            const attrs = cm[1];
            const inner = cm[2] || '';
            const refM = /\br="([A-Z]+\d+)"/.exec(attrs);
            if (!refM) continue;
            const { c: cIdx } = parseRef(refM[1]);
            const typeM = /\bt="([^"]+)"/.exec(attrs);
            const cType = typeM ? typeM[1] : 'n';

            let val = null;
            if (cType === 's') {
              const vM = /<v>([\s\S]*?)<\/v>/.exec(inner);
              if (vM) {
                const sstIdx = parseInt(vM[1], 10);
                val = sharedStrings[sstIdx] !== undefined ? sharedStrings[sstIdx] : vM[1];
              }
            } else if (cType === 'inlineStr' || cType === 'str') {
              const tMatches = [...inner.matchAll(/<t(?:\s+[^>]*)?>([\s\S]*?)<\/t>/g)];
              val = tMatches.map(m => decodeXmlEntities(m[1])).join('');
            } else {
              const vM = /<v>([\s\S]*?)<\/v>/.exec(inner);
              if (vM) {
                const num = parseFloat(vM[1]);
                val = Number.isNaN(num) ? decodeXmlEntities(vM[1]) : excelSerialToDateOrTime(num);
              }
            }
            cells[cIdx] = val;
          }
          const cleanRow = [];
          for (let c = 0; c < cells.length; c++) cleanRow.push(cells[c] !== undefined ? cells[c] : null);
          while (cleanRow.length > 0 && cleanRow[cleanRow.length - 1] === null) cleanRow.pop();
          rowsMap.set(rIdx, cleanRow);
        }

        const rows = [];
        for (let r = 0; r < maxRow; r++) rows.push(rowsMap.get(r) || []);
        result[s.name] = { rows, merges };
      }
      return result;
    }

    async function parseExcelArrayBuffer(arrayBuffer) {
      try {
        return await parseXlsxBinaryNative(arrayBuffer);
      } catch (nativeErr) {
        if (window.XLSX) {
          const wb = window.XLSX.read(arrayBuffer, { type: 'array', cellDates: false });
          const out = {};
          for (const name of wb.SheetNames) {
            const ws = wb.Sheets[name];
            const rawRows = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
            const formattedRows = rawRows.map(r => r.map(v => {
              if (typeof v === 'number') {
                if (v >= 0 && v < 1) {
                  const mins = Math.round(v * 24 * 60);
                  return `${String(Math.floor(mins / 60) % 24).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
                }
                if (v > 36000 && v < 75000) {
                  return new Date(Math.round((v - 25569) * 86400 * 1000)).toISOString().slice(0, 10);
                }
              }
              return v !== null && v !== undefined ? String(v) : null;
            }));
            out[name] = { rows: formattedRows, merges: ws['!merges'] || [] };
          }
          return out;
        }
        throw nativeErr;
      }
    }

    // ============================================================================
    // 3. PROCESADOR DE DATOS ACADÉMICOS (CLASIFICACIÓN 8 MÓDULOS Y 4 BLOQUES)
    // ============================================================================
    function normalizeText(str) {
      return String(str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim();
    }

    function parseTimeMinutes(timeStr) {
      if (!timeStr) return null;
      const m = /^(\d{1,2}):(\d{2})/.exec(String(timeStr).trim());
      if (!m) return null;
      return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    }

    function classifyModuleAndBlock(rawModulo, rawSesion) {
      const modNorm = normalizeText(rawModulo);
      const sesNorm = normalizeText(rawSesion);
      const combined = `${modNorm} ${sesNorm}`;

      const modMatch = /\b(?:MODULO|MOD|M)\s*([1-8])\b/.exec(combined);
      if (modMatch) {
        const num = parseInt(modMatch[1], 10);
        const modId = `M${num}`;
        const cfg = MODULES_CONFIG[modId];
        return {
          moduleId: modId,
          moduleNumber: num,
          moduleLabel: cfg.label,
          moduleFullLabel: cfg.fullLabel,
          blockId: cfg.block,
          blockName: BLOCKS_CONFIG[cfg.block].name,
          isOfficialModule: true,
          isIsak: false,
          isPendingSlot: !rawSesion
        };
      }

      if (combined.includes('ISAK') || combined.includes('CINEANTROPOMETRIA')) {
        return {
          moduleId: 'ISAK',
          moduleNumber: 4,
          moduleLabel: 'Curso ISAK',
          moduleFullLabel: MODULES_CONFIG.ISAK.fullLabel,
          blockId: 'NUTRICION',
          blockName: BLOCKS_CONFIG.NUTRICION.name,
          isOfficialModule: false,
          isIsak: true,
          isPendingSlot: false
        };
      }

      if (modNorm.includes('BIENVENIDA') || modNorm.includes('EVENTO') || modNorm.includes('ACTO') || sesNorm.includes('GET TOGETHER') || sesNorm.includes('BIENVENIDA')) {
        return {
          moduleId: 'EVENTO',
          moduleNumber: 9,
          moduleLabel: rawModulo ? String(rawModulo).trim() : 'Institucional',
          moduleFullLabel: MODULES_CONFIG.EVENTO.fullLabel,
          blockId: 'INSTITUCIONAL',
          blockName: BLOCKS_CONFIG.INSTITUCIONAL.name,
          isOfficialModule: false,
          isIsak: false,
          isPendingSlot: false
        };
      }

      if (sesNorm.includes('NUTRICION') || sesNorm.includes('DIETETICA') || sesNorm.includes('ALIMENTO') || sesNorm.includes('SUPLEMENTACION') || sesNorm.includes('INDYA') || sesNorm.includes('INTESTINAL') || sesNorm.includes('MICRONUTRIENTE')) {
        return {
          moduleId: 'M4',
          moduleNumber: 4,
          moduleLabel: 'Módulo 4',
          moduleFullLabel: MODULES_CONFIG.M4.fullLabel,
          blockId: 'NUTRICION',
          blockName: BLOCKS_CONFIG.NUTRICION.name,
          isOfficialModule: true,
          isIsak: false,
          isPendingSlot: false
        };
      }

      if (sesNorm.includes('SIMULACION') || sesNorm.includes('PRACTICA') || sesNorm.includes('HOSPITAL')) {
        return {
          moduleId: 'M7',
          moduleNumber: 7,
          moduleLabel: 'Módulo 7',
          moduleFullLabel: MODULES_CONFIG.M7.fullLabel,
          blockId: 'PRACTICAS',
          blockName: BLOCKS_CONFIG.PRACTICAS.name,
          isOfficialModule: true,
          isIsak: false,
          isPendingSlot: false
        };
      }

      if (sesNorm.includes('TFM') || sesNorm.includes('TFG') || sesNorm.includes('FIN DE MASTER') || sesNorm.includes('METODOLOGIA') || sesNorm.includes('BIBLIOTECA')) {
        return {
          moduleId: 'M8',
          moduleNumber: 8,
          moduleLabel: 'Módulo 8',
          moduleFullLabel: MODULES_CONFIG.M8.fullLabel,
          blockId: 'TFG',
          blockName: BLOCKS_CONFIG.TFG.name,
          isOfficialModule: true,
          isIsak: false,
          isPendingSlot: false
        };
      }

      if (sesNorm.includes('FISIOLOGIA') || sesNorm.includes('ENTRENAMIENTO') || sesNorm.includes('FUERZA') || sesNorm.includes('VELOCIDAD') || sesNorm.includes('RESISTENCIA') || sesNorm.includes('GENETICA') || sesNorm.includes('CANTERA') || sesNorm.includes('PLANIFICACION DEPORTIVA')) {
        return {
          moduleId: 'M1',
          moduleNumber: 1,
          moduleLabel: 'Módulo 1',
          moduleFullLabel: MODULES_CONFIG.M1.fullLabel,
          blockId: 'ENTRENAMIENTO',
          blockName: BLOCKS_CONFIG.ENTRENAMIENTO.name,
          isOfficialModule: true,
          isIsak: false,
          isPendingSlot: false
        };
      }

      return {
        moduleId: 'PENDIENTE',
        moduleNumber: 0,
        moduleLabel: 'Reserva',
        moduleFullLabel: MODULES_CONFIG.PENDIENTE.fullLabel,
        blockId: 'INSTITUCIONAL',
        blockName: 'Franja Reservada',
        isOfficialModule: false,
        isIsak: false,
        isPendingSlot: true
      };
    }

    function detectSportswear(rawModulo, rawSesion, rawAula, rawComentarios) {
      const fullNorm = normalizeText(`${rawModulo || ''} ${rawSesion || ''} ${rawAula || ''} ${rawComentarios || ''}`);
      const exactRopaDeportiva = fullNorm.includes('ROPA DEPORTIVA') || fullNorm.includes('INDUMENTARIA DEPORTIVA');
      const isakRopa = fullNorm.includes('ROPA ADECUADA');
      return {
        requiresSportswear: exactRopaDeportiva || isakRopa,
        isExactRopaDeportiva: exactRopaDeportiva,
        isIsakRopa: isakRopa,
        tooltipText: '⚠️ Hay que asistir con ropa deportiva a esta clase',
        rawClothingNote: rawComentarios || 'ROPA DEPORTIVA'
      };
    }

    function detectSpecificSubgroup(sheetGroupKey, rawModulo, rawSesion, rawAula, rawComentarios) {
      const text = normalizeText(`${rawModulo || ''} ${rawSesion || ''} ${rawAula || ''} ${rawComentarios || ''}`);
      const hasM11 = /\bM11\b/.test(text);
      const hasM12 = /\bM12\b/.test(text);
      const hasM13 = /\bM13\b/.test(text);
      const hasM14 = /\bM14\b/.test(text);
      if (sheetGroupKey === 'M11_M12') {
        if (hasM11 && !hasM12) return ['M11'];
        if (hasM12 && !hasM11) return ['M12'];
        return ['M11', 'M12'];
      }
      if (sheetGroupKey === 'M13_M14') {
        if (hasM13 && !hasM14) return ['M13'];
        if (hasM14 && !hasM13) return ['M14'];
        return ['M13', 'M14'];
      }
      return ['M11', 'M12', 'M13', 'M14'];
    }

    const WEEKDAY_MAP_ES = {
      'DOMINGO': 0, 'LUNES': 1, 'MARTES': 2, 'MIERCOLES': 3, 'JUEVES': 4, 'VIERNES': 5, 'SABADO': 6
    };

    function resolveCalendarDate(rawDateStr, rawDayName, neighborYear) {
      if (!rawDateStr) return { dateISO: null, rawDateISO: null, wasYearNormalized: false };
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(rawDateStr).trim());
      if (!m) return { dateISO: String(rawDateStr).trim(), rawDateISO: String(rawDateStr).trim(), wasYearNormalized: false };
      let year = parseInt(m[1], 10);
      const month = parseInt(m[2], 10);
      const day = parseInt(m[3], 10);
      const rawISO = `${m[1]}-${m[2]}-${m[3]}`;

      const expectedDow = WEEKDAY_MAP_ES[normalizeText(rawDayName)];
      if (expectedDow !== undefined && neighborYear && year !== neighborYear) {
        const dOriginal = new Date(Date.UTC(year, month - 1, day));
        const dNeighbor = new Date(Date.UTC(neighborYear, month - 1, day));
        if (dOriginal.getUTCDay() !== expectedDow && dNeighbor.getUTCDay() === expectedDow) {
          const fixedISO = `${neighborYear}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          return {
            dateISO: fixedISO,
            rawDateISO: rawISO,
            wasYearNormalized: true,
            normalizationNote: `En el Excel figura "${rawISO}", normalizado a "${fixedISO}" por corresponder a ${rawDayName} en orden cronológico de ${neighborYear}.`
          };
        }
      }
      return { dateISO: rawISO, rawDateISO: rawISO, wasYearNormalized: false };
    }

    function processWorkbookData(sheetsObj) {
      const allSessions = [];
      const sheetFooters = {};
      const sheetHeadersMap = {};

      for (const [rawSheetName, sheetPayload] of Object.entries(sheetsObj)) {
        const cleanSheetName = rawSheetName.trim();
        const normSheet = normalizeText(cleanSheetName);
        let sheetGroupKey = 'COMUN';
        let sheetGroupLabel = cleanSheetName;
        if (normSheet.includes('M11') || normSheet.includes('M12')) {
          sheetGroupKey = 'M11_M12';
          sheetGroupLabel = 'M11 / M12';
        } else if (normSheet.includes('M13') || normSheet.includes('M14')) {
          sheetGroupKey = 'M13_M14';
          sheetGroupLabel = 'M13 / M14';
        }

        const rows = (sheetPayload.rows || []).map(r => [...r]);
        const merges = sheetPayload.merges || [];

        let headerRowIdx = 3;
        for (let r = 0; r < Math.min(10, rows.length); r++) {
          const joined = normalizeText((rows[r] || []).join(' '));
          if (joined.includes('FECHA') && (joined.includes('MODULO') || joined.includes('SESION') || joined.includes('HORA'))) {
            headerRowIdx = r;
            break;
          }
        }

        const headers = (rows[headerRowIdx] || []).map((h, idx) => h ? String(h).trim() : `Columna ${idx + 1}`);
        sheetHeadersMap[sheetGroupKey] = headers;

        for (const mg of merges) {
          if (!mg || !mg.s || !mg.e) continue;
          if (mg.s.r <= headerRowIdx) continue;
          const isFullRowBanner = (mg.e.c - mg.s.c >= 5) && (mg.s.r === mg.e.r);
          if (isFullRowBanner) continue;
          const topVal = (rows[mg.s.r] && rows[mg.s.r][mg.s.c]) !== undefined ? rows[mg.s.r][mg.s.c] : null;
          if (topVal !== null) {
            for (let rr = mg.s.r; rr <= mg.e.r; rr++) {
              if (!rows[rr]) rows[rr] = [];
              for (let cc = mg.s.c; cc <= mg.e.c; cc++) {
                if (rows[rr][cc] === null || rows[rr][cc] === undefined) rows[rr][cc] = topVal;
              }
            }
          }
        }

        const rowYears = {};
        for (let r = headerRowIdx + 1; r < rows.length; r++) {
          const fVal = rows[r] ? rows[r][1] : null;
          const m = /^(\d{4})-\d{2}-\d{2}/.exec(String(fVal || ''));
          if (m) rowYears[r] = parseInt(m[1], 10);
        }

        for (let r = headerRowIdx + 1; r < rows.length; r++) {
          const row = rows[r] || [];
          const nonEmpty = row.filter(v => v !== null && v !== undefined && String(v).trim() !== '');
          if (nonEmpty.length === 0) continue;

          if (nonEmpty.length === 1 && !row[1] && normalizeText(row[0]).includes('SUJETO A CAMBIOS')) {
            sheetFooters[sheetGroupKey] = String(row[0]).trim();
            continue;
          }

          const rawDia = row[0] ? String(row[0]).trim() : '';
          const rawFecha = row[1] ? String(row[1]).trim() : '';
          const rawHoraInicio = row[2] ? String(row[2]).trim() : null;
          const rawHoraFin = row[3] ? String(row[3]).trim() : null;
          const rawModulo = row[4] ? String(row[4]).trim() : null;
          const rawSesion = row[5] ? String(row[5]).trim() : null;
          const rawAula = row[6] ? String(row[6]).trim() : null;
          const rawProfesores = row[7] ? String(row[7]).trim() : null;
          const rawComentarios = row[8] ? String(row[8]).trim() : null;

          const prevYear = rowYears[r - 1] || rowYears[r - 2] || 2026;
          const nextYear = rowYears[r + 1] || rowYears[r + 2] || prevYear;
          const neighborYear = prevYear === nextYear ? prevYear : 2026;

          const dateInfo = resolveCalendarDate(rawFecha, rawDia, neighborYear);
          if (!dateInfo.dateISO) continue;

          const startMin = parseTimeMinutes(rawHoraInicio);
          const endMin = parseTimeMinutes(rawHoraFin);
          let durationHours = 0;
          if (startMin !== null && endMin !== null && endMin > startMin) {
            durationHours = Math.round(((endMin - startMin) / 60) * 100) / 100;
          }

          const classification = classifyModuleAndBlock(rawModulo, rawSesion);
          const sportswear = detectSportswear(rawModulo, rawSesion, rawAula, rawComentarios);
          const subgroups = detectSpecificSubgroup(sheetGroupKey, rawModulo, rawSesion, rawAula, rawComentarios);

          const allRowColumns = [];
          const maxCols = Math.max(headers.length, row.length);
          for (let c = 0; c < maxCols; c++) {
            const colTitle = headers[c] || `Columna Extra ${c + 1}`;
            const cellVal = row[c] !== undefined && row[c] !== null && String(row[c]).trim() !== '' ? String(row[c]) : null;
            if (c < headers.length || cellVal !== null) {
              allRowColumns.push({ colIndex: c + 1, header: colTitle, value: cellVal });
            }
          }

          let displayTitle = rawSesion;
          if (!displayTitle) {
            if (rawModulo) {
              displayTitle = `${rawModulo} · Sesión por detallar en Excel`;
            } else if (rawHoraInicio && rawHoraFin) {
              displayTitle = `Franja reservada (${rawHoraInicio}–${rawHoraFin}) · Pendiente en Excel`;
            } else {
              displayTitle = `Franja reservada en calendario · Pendiente en Excel`;
            }
          }

          allSessions.push({
            id: `${sheetGroupKey}_R${r + 1}`,
            excelRowNumber: r + 1,
            sheetName: rawSheetName,
            sheetNameClean: cleanSheetName,
            groupKey: sheetGroupKey,
            groupLabel: sheetGroupLabel,
            subgroups,
            diaSemanaExcel: rawDia,
            dateISO: dateInfo.dateISO,
            rawDateISO: dateInfo.rawDateISO,
            wasYearNormalized: dateInfo.wasYearNormalized,
            normalizationNote: dateInfo.normalizationNote || null,
            startTime: rawHoraInicio ? rawHoraInicio.slice(0, 5) : null,
            endTime: rawHoraFin ? rawHoraFin.slice(0, 5) : null,
            startMinutes: startMin,
            endMinutes: endMin,
            durationHours,
            rawModulo,
            rawSesion,
            displayTitle,
            aula: rawAula,
            profesores: rawProfesores,
            comentarios: rawComentarios,
            modalidade: (normalizeText(rawAula).includes('ONLINE') || normalizeText(rawComentarios).includes('ONLINE'))
              ? (normalizeText(rawAula) === 'ONLINE' ? 'Online' : 'Híbrida / Presencial + Online')
              : 'Presencial',
            ...classification,
            ...sportswear,
            allRowColumns
          });
        }
      }

      const sigMap = new Map();
      for (const s of allSessions) {
        const sig = `${s.dateISO}|${s.startTime || ''}|${normalizeText(s.rawSesion || '')}`;
        if (!sigMap.has(sig)) sigMap.set(sig, new Set());
        sigMap.get(sig).add(s.groupKey);
      }
      for (const s of allSessions) {
        const sig = `${s.dateISO}|${s.startTime || ''}|${normalizeText(s.rawSesion || '')}`;
        const gSet = sigMap.get(sig);
        s.isCommonToAllMaster = Boolean(s.rawSesion && gSet && gSet.size > 1);
      }

      allSessions.sort((a, b) => {
        if (a.dateISO !== b.dateISO) return a.dateISO.localeCompare(b.dateISO);
        const aMin = a.startMinutes !== null ? a.startMinutes : 9999;
        const bMin = b.startMinutes !== null ? b.startMinutes : 9999;
        return aMin - bMin;
      });

      return { sessions: allSessions, footers: sheetFooters, headers: sheetHeadersMap };
    }

    // Utilidades de fechas y detección automática de la SEMANA ACTUAL
    function getMondayOfDateISO(dateISO) {
      const [y, m, d] = dateISO.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      const dow = dt.getUTCDay();
      const diffToMonday = dow === 0 ? -6 : 1 - dow;
      dt.setUTCDate(dt.getUTCDate() + diffToMonday);
      return dt.toISOString().slice(0, 10);
    }

    function addDaysISO(dateISO, days) {
      const [y, m, d] = dateISO.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      dt.setUTCDate(dt.getUTCDate() + days);
      return dt.toISOString().slice(0, 10);
    }

    function getRealTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const iso = `${y}-${m}-${d}`;
      // Si el reloj del dispositivo está fuera del curso 2026/2027, usar 2026-10-17 como referencia de curso activo
      if (y < 2026 || y > 2027) return '2026-10-17';
      return iso;
    }

    function getInitialAcademicWeekMonday(parsedData) {
      const todayISO = getRealTodayISO();
      const todayMonday = getMondayOfDateISO(todayISO);
      const sessions = parsedData?.sessions || [];
      if (sessions.length === 0) return todayMonday;

      const weekMondays = [...new Set(sessions.map(s => getMondayOfDateISO(s.dateISO)))].sort();
      if (weekMondays.includes(todayMonday)) return todayMonday;
      const upcoming = weekMondays.find(w => w >= todayMonday);
      return upcoming || weekMondays[0] || '2026-10-12';
    }

    // ============================================================================
    // 4. ESTADO GLOBAL (POR DEFECTO EN LA SEMANA ACTUAL) Y SINCRONIZACIÓN LIVE
    // ============================================================================
    const IDB_NAME = 'UERM_Master_Calendar_DB';
    const IDB_STORE = 'workbooks';

    function saveWorkbookToCache(sheetsObj, meta) {
      try {
        localStorage.setItem('uerm_master_wb_cache_v3', JSON.stringify({ sheetsObj, meta, savedAt: new Date().toISOString() }));
      } catch (e) {}
      try {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          const db = req.result;
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put({ sheetsObj, meta, savedAt: new Date().toISOString() }, 'latest');
        };
      } catch (e) {}
    }

    function loadWorkbookFromLocalCache() {
      try {
        const raw = localStorage.getItem('uerm_master_wb_cache_v3');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    }

    const initialParsed = processWorkbookData(INITIAL_WORKBOOK_DATA);
    const initialWeekMonday = getInitialAcademicWeekMonday(initialParsed);

    const state = {

      statsMonthChartMode: 'BLOCKS',
      statsMonthChartStacked: true,

      activeDialogType: null, // 'SESSION' | 'SPORTSWEAR' | 'UPLOAD' | 'ONBOARDING' | 'GUIDE'
      selectedSessionId: null,

      // Estado de conexión en directo con SharePoint
      syncStatus: 'SYNCED',
      syncSourceLabel: 'SharePoint Directo · Universidad Europea',
      lastSyncTime: new Date(),
      lastSyncETag: '{2221AB0D-7B08-41D1-9B25-5B12D23CF40A},43',
      lastModifiedHeader: 'Conectado en tiempo real',
      nextSyncSeconds: 300,
      syncLogMessage: 'Sincronizado en directo con el Excel de SharePoint'
    };

    const cached = loadWorkbookFromLocalCache();
    if (cached && cached.sheetsObj) {
      state.workbookRaw = cached.sheetsObj;
      state.parsedData = processWorkbookData(cached.sheetsObj);
    }

    async function syncWithSharePoint(isManualClick = false) {
      state.syncStatus = 'SYNCING';
      state.syncLogMessage = 'Consultando cambios en el Excel de SharePoint...';
      renderApp();

      const cacheBuster = Date.now();
      const isHttpsHost = typeof window !== 'undefined' && window.location && window.location.protocol === 'https:';
      const candidateEndpoints = [
        {
          name: 'SharePoint Live · Universidad Europea',
          url: `${SHAREPOINT_DIRECT_CORS_URL}&_cb=${cacheBuster}`,
          type: 'binary'
        },
        ...(isHttpsHost ? [
          {
            name: 'Respaldo Cloud (calendario.xlsx)',
            url: `./calendario.xlsx?t=${cacheBuster}`,
            type: 'binary'
          }
        ] : [
          {
            name: 'SharePoint Local Bridge (.xlsx)',
            url: `${LOCAL_BRIDGE_XLSX_URL}?t=${cacheBuster}`,
            type: 'binary'
          }
        ]),
        {
          name: 'SharePoint Enlace Directo',
          url: `${SHAREPOINT_BASE_URL}&download=1&t=${cacheBuster}`,
          type: 'binary'
        }
      ];

      for (const endpoint of candidateEndpoints) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 6500);
          const resp = await fetch(endpoint.url, { method: 'GET', cache: 'no-store', signal: controller.signal });
          clearTimeout(timer);
          if (!resp.ok) continue;

          const buf = await resp.arrayBuffer();
          const u8 = new Uint8Array(buf);
          if (u8.length > 1000 && u8[0] === 0x50 && u8[1] === 0x4B) {
            const sheetsObj = await parseExcelArrayBuffer(buf);
            if (sheetsObj && Object.keys(sheetsObj).length > 0) {
              const etag = resp.headers.get('ETag') || resp.headers.get('X-SharePoint-ETag') || state.lastSyncETag;
              state.workbookRaw = sheetsObj;
              state.parsedData = processWorkbookData(sheetsObj);
              state.syncStatus = 'SYNCED';
              state.syncSourceLabel = endpoint.name;
              state.lastSyncTime = new Date();
              state.lastSyncETag = etag;
              state.nextSyncSeconds = 300;
              state.syncLogMessage = `Sincronizado (${state.parsedData.sessions.length} sesiones activas)`;
              saveWorkbookToCache(sheetsObj, { source: endpoint.name, etag });
              renderApp();
              return true;
            }
          }
        } catch (err) {}
      }

      state.syncStatus = 'SYNCED';
      state.lastSyncTime = new Date();
      state.nextSyncSeconds = 300;
      state.syncLogMessage = isManualClick ? 'Datos al día con la última versión disponible' : 'Conectado a copia sincronizada';
      renderApp();
      return false;
    }

    async function handleManualFileUpload(file) {
      if (!file) return;
      try {
        state.syncStatus = 'SYNCING';
        renderApp();
        const buf = await file.arrayBuffer();
        const sheetsObj = await parseExcelArrayBuffer(buf);
        if (!sheetsObj || Object.keys(sheetsObj).length === 0) {
          throw new Error('No se encontraron hojas válidas en el Excel.');
        }
        state.workbookRaw = sheetsObj;
        state.parsedData = processWorkbookData(sheetsObj);
        state.syncStatus = 'MANUAL_FILE';
        state.syncSourceLabel = `Archivo manual: ${file.name}`;
        state.lastSyncTime = new Date();
        state.nextSyncSeconds = 300;
        closeDialogModal();
        saveWorkbookToCache(sheetsObj, { source: `Manual: ${file.name}` });
        renderApp();
      } catch (err) {
        alert('Error al leer el archivo .xlsx: ' + (err.message || err));
        state.syncStatus = 'SYNCED';
        renderApp();
      }
    }

    // ============================================================================
    // 5. FILTRADO Y CÁLCULO DE ESTADÍSTICAS
    // ============================================================================
    function getEffectiveGroupKey() {
      return state.selectedGroup || 'M11_M12';
    }

    function getSessionsForSelectedGroup() {
      const all = state.parsedData.sessions || [];
      const gKey = getEffectiveGroupKey();
      if (state.selectedSubgroup === 'BOTH_GROUPS') return all;
      return all.filter(s => {
        if (s.groupKey !== gKey && s.groupKey !== 'COMUN') return false;
        if (state.selectedSubgroup && state.selectedSubgroup !== 'ALL') {
          return s.subgroups.includes(state.selectedSubgroup);
        }
        return true;
      });
    }

    function getFilteredCalendarSessions() {
      const base = getSessionsForSelectedGroup();
      const q = normalizeText(state.searchQuery);
      return base.filter(s => {
        if (state.calendarBlockFilter !== 'ALL' && s.blockId !== state.calendarBlockFilter) return false;
        if (state.calendarModuleFilter !== 'ALL' && s.moduleId !== state.calendarModuleFilter) return false;
        if (state.onlySportswearFilter && !s.requiresSportswear) return false;
        if (q) {
          const hay = normalizeText(`${s.displayTitle} ${s.rawModulo || ''} ${s.moduleLabel} ${s.blockName} ${s.profesores || ''} ${s.aula || ''} ${s.comentarios || ''} ${s.dateISO} ${s.diaSemanaExcel}`);
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function formatShortDateES(dateISO) {
      if (!dateISO) return '';
      const [y, m, d] = dateISO.split('-').map(Number);
      return `${d} ${MONTHS_ES[m - 1].slice(0, 3)} ${y}`;
    }

    function formatDayMonthES(dateISO) {
      if (!dateISO) return '';
      const [, m, d] = dateISO.split('-').map(Number);
      return `${d} ${MONTHS_ES[m - 1].slice(0, 3)}`;
    }

    function formatFullDateES(dateISO) {
      if (!dateISO) return '';
      const [y, m, d] = dateISO.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      const dowIdx = (dt.getUTCDay() + 6) % 7;
      return `${DAYS_ES[dowIdx]}, ${d} de ${MONTHS_ES[m - 1]} de ${y}`;
    }

    function computeMasterStatistics() {
      const groupSessionsRaw = getSessionsForSelectedGroup();
      const baseSessions = groupSessionsRaw.filter(s => {
        if (s.isIsak && !state.statsIncludeIsakInNutricion) return false;
        if (s.blockId === 'INSTITUCIONAL' && !state.statsIncludeInstitutional) return false;
        return true;
      });

      const filteredSessions = baseSessions.filter(s => {
        if (state.statsBlockMode === 'ENTRENAMIENTO' && s.blockId !== 'ENTRENAMIENTO') return false;
        if (state.statsBlockMode === 'NUTRICION' && s.blockId !== 'NUTRICION') return false;
        if (state.statsBlockMode === 'PRACTICAS' && s.blockId !== 'PRACTICAS') return false;
        if (state.statsBlockMode === 'TFG' && s.blockId !== 'TFG') return false;
        if (state.statsBlockMode === 'COMPARE_ENT_NUT' && s.blockId !== 'ENTRENAMIENTO' && s.blockId !== 'NUTRICION') return false;
        if (state.statsModuleFilter !== 'ALL') {
          if (state.statsModuleFilter === 'M4' && s.isIsak && state.statsIncludeIsakInNutricion) return true;
          if (s.moduleId !== state.statsModuleFilter) return false;
        }
        return true;
      });

      const sumHours = arr => Math.round(arr.reduce((acc, s) => acc + (s.durationHours || 0), 0) * 100) / 100;
      const totalHoursFiltered = sumHours(filteredSessions);
      const totalSessionsFiltered = filteredSessions.length;
      const uniqueDaysFiltered = new Set(filteredSessions.map(s => s.dateISO)).size;

      const hoursByBlock = {
        ENTRENAMIENTO: sumHours(filteredSessions.filter(s => s.blockId === 'ENTRENAMIENTO')),
        NUTRICION: sumHours(filteredSessions.filter(s => s.blockId === 'NUTRICION')),
        PRACTICAS: sumHours(filteredSessions.filter(s => s.blockId === 'PRACTICAS')),
        TFG: sumHours(filteredSessions.filter(s => s.blockId === 'TFG')),
        INSTITUCIONAL: sumHours(filteredSessions.filter(s => s.blockId === 'INSTITUCIONAL'))
      };

      const moduleBreakdown = {};
      for (const mKey of ['M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7', 'M8', 'ISAK', 'EVENTO', 'PENDIENTE']) {
        const modSessionsAll = baseSessions.filter(s => s.moduleId === mKey);
        const modSessionsFiltered = filteredSessions.filter(s => s.moduleId === mKey);
        moduleBreakdown[mKey] = {
          id: mKey,
          config: MODULES_CONFIG[mKey],
          totalHoursAll: sumHours(modSessionsAll),
          totalSessionsAll: modSessionsAll.length,
          hours: sumHours(modSessionsFiltered),
          sessionsCount: modSessionsFiltered.length,
          sportswearCount: modSessionsFiltered.filter(s => s.requiresSportswear).length,
          sportswearHours: sumHours(modSessionsFiltered.filter(s => s.requiresSportswear)),
          professors: [...new Set(modSessionsFiltered.map(s => s.profesores).filter(Boolean))],
          subjects: [...new Set(modSessionsFiltered.map(s => s.rawSesion).filter(Boolean))]
        };
      }

      const monthMap = new Map();
      for (const s of filteredSessions) {
        const ym = s.dateISO.slice(0, 7);
        if (!monthMap.has(ym)) {
          const [y, m] = ym.split('-').map(Number);
          monthMap.set(ym, {
            ym, year: y, monthIndex: m - 1,
            label: `${MONTHS_ES[m - 1]} ${y}`,
            shortLabel: `${MONTHS_ES[m - 1].slice(0, 3)} ${String(y).slice(2)}`,
            totalHours: 0, totalSessions: 0, sportswearSessions: 0, sportswearHours: 0,
            byBlock: { ENTRENAMIENTO: 0, NUTRICION: 0, PRACTICAS: 0, TFG: 0, INSTITUCIONAL: 0 },
            byModule: { M1: 0, M2: 0, M3: 0, M4: 0, M5: 0, M6: 0, M7: 0, M8: 0, ISAK: 0, EVENTO: 0, PENDIENTE: 0 }
          });
        }
        const mEntry = monthMap.get(ym);
        mEntry.totalHours = Math.round((mEntry.totalHours + s.durationHours) * 100) / 100;
        mEntry.totalSessions += 1;
        if (s.requiresSportswear) {
          mEntry.sportswearSessions += 1;
          mEntry.sportswearHours = Math.round((mEntry.sportswearHours + s.durationHours) * 100) / 100;
        }
        mEntry.byBlock[s.blockId] = Math.round(((mEntry.byBlock[s.blockId] || 0) + s.durationHours) * 100) / 100;
        mEntry.byModule[s.moduleId] = Math.round(((mEntry.byModule[s.moduleId] || 0) + s.durationHours) * 100) / 100;
      }
      const monthlyData = [...monthMap.values()].sort((a, b) => a.ym.localeCompare(b.ym));

      const weekMap = new Map();
      for (const s of filteredSessions) {
        const monISO = getMondayOfDateISO(s.dateISO);
        const sunISO = addDaysISO(monISO, 6);
        if (!weekMap.has(monISO)) {
          weekMap.set(monISO, {
            mondayISO: monISO, sundayISO: sunISO,
            rangeLabel: `${formatDayMonthES(monISO)} – ${formatShortDateES(sunISO)}`,
            shortLabel: `${monISO.slice(8, 10)}/${monISO.slice(5, 7)}`,
            totalHours: 0, totalSessions: 0, sportswearSessions: 0, sportswearHours: 0,
            byBlock: { ENTRENAMIENTO: 0, NUTRICION: 0, PRACTICAS: 0, TFG: 0, INSTITUCIONAL: 0 },
            byModule: { M1: 0, M2: 0, M3: 0, M4: 0, M5: 0, M6: 0, M7: 0, M8: 0, ISAK: 0, EVENTO: 0, PENDIENTE: 0 },
            sessions: []
          });
        }
        const wEntry = weekMap.get(monISO);
        wEntry.totalHours = Math.round((wEntry.totalHours + s.durationHours) * 100) / 100;
        wEntry.totalSessions += 1;
        if (s.requiresSportswear) {
          wEntry.sportswearSessions += 1;
          wEntry.sportswearHours = Math.round((wEntry.sportswearHours + s.durationHours) * 100) / 100;
        }
        wEntry.byBlock[s.blockId] = Math.round(((wEntry.byBlock[s.blockId] || 0) + s.durationHours) * 100) / 100;
        wEntry.byModule[s.moduleId] = Math.round(((wEntry.byModule[s.moduleId] || 0) + s.durationHours) * 100) / 100;
        wEntry.sessions.push(s);
      }
      const weeklyData = [...weekMap.values()]
        .sort((a, b) => a.mondayISO.localeCompare(b.mondayISO))
        .map((w, idx) => ({ ...w, weekNumber: idx + 1 }));

      const avgHoursPerMonth = monthlyData.length > 0 ? Math.round((totalHoursFiltered / monthlyData.length) * 10) / 10 : 0;
      const avgHoursPerWeek = weeklyData.length > 0 ? Math.round((totalHoursFiltered / weeklyData.length) * 10) / 10 : 0;
      const peakWeek = weeklyData.reduce((best, cur) => (!best || cur.totalHours > best.totalHours ? cur : best), null);
      const sportswearSessions = filteredSessions.filter(s => s.requiresSportswear);
      const sportswearHours = sumHours(sportswearSessions);

      const profMap = new Map();
      for (const s of filteredSessions) {
        const pName = s.profesores ? s.profesores.trim() : 'Por confirmar';
        if (!profMap.has(pName)) profMap.set(pName, { name: pName, hours: 0, sessions: 0, modules: new Set(), blocks: new Set() });
        const p = profMap.get(pName);
        p.hours = Math.round((p.hours + s.durationHours) * 100) / 100;
        p.sessions += 1;
        p.modules.add(s.moduleLabel);
        p.blocks.add(BLOCKS_CONFIG[s.blockId]?.shortName || s.blockId);
      }
      const professorsData = [...profMap.values()].sort((a, b) => b.hours - a.hours);

      return {
        filteredSessions, baseSessions, totalHoursFiltered, totalSessionsFiltered, uniqueDaysFiltered,
        hoursByBlock, moduleBreakdown, monthlyData, weeklyData, avgHoursPerMonth, avgHoursPerWeek,
        peakWeek, sportswearSessionsCount: sportswearSessions.length,
        sportswearExactCount: sportswearSessions.filter(s => s.isExactRopaDeportiva).length,
        sportswearIsakCount: sportswearSessions.filter(s => s.isIsakRopa && !s.isExactRopaDeportiva).length,
        sportswearHours, professorsData
      };
    }

    function renderWeekView(filteredSessions) {
      const groupSessions = getSessionsForSelectedGroup();
      const todayISO = getRealTodayISO();
      const currentRealWeekMonday = getInitialAcademicWeekMonday(state.parsedData);

      // Construir lista de semanas activas del curso para navegación rápida
      const activeWeeksMap = new Map();
      for (const s of groupSessions) {
        const mon = getMondayOfDateISO(s.dateISO);
        if (!activeWeeksMap.has(mon)) activeWeeksMap.set(mon, { mondayISO: mon, count: 0, hours: 0, sportswear: 0 });
        const w = activeWeeksMap.get(mon);
        w.count += 1;
        w.hours = Math.round((w.hours + s.durationHours) * 10) / 10;
        if (s.requiresSportswear) w.sportswear += 1;
      }
      const activeWeeks = [...activeWeeksMap.values()].sort((a, b) => a.mondayISO.localeCompare(b.mondayISO));

      const weekMonday = state.currentWeekStartISO;
      const weekDays = [];
      for (let i = 0; i < 7; i++) {
        const dISO = addDaysISO(weekMonday, i);
        const [y, m, d] = dISO.split('-').map(Number);
        const daySessions = filteredSessions.filter(s => s.dateISO === dISO);
        weekDays.push({
          index: i,
          dayName: DAYS_ES[i],
          dayShort: DAYS_SHORT_ES[i],
          dayInitial: DAYS_INITIAL_ES[i],
          dateISO: dISO,
          dayNumber: d,
          monthShort: MONTHS_ES[m - 1].slice(0, 3),
          sessions: daySessions,
          timedSessions: daySessions.filter(s => s.startMinutes !== null && s.endMinutes !== null),
          untimedSessions: daySessions.filter(s => s.startMinutes === null || s.endMinutes === null),
          totalHours: Math.round(daySessions.reduce((a, b) => a + b.durationHours, 0) * 10) / 10,
          hasSportswear: daySessions.some(s => s.requiresSportswear)
        });
      }

      const weekTotalHours = Math.round(weekDays.reduce((a, d) => a + d.totalHours, 0) * 10) / 10;
      const weekTotalSessions = weekDays.reduce((a, d) => a + d.sessions.length, 0);
      const weekSportswearCount = weekDays.reduce((a, d) => a + d.sessions.filter(s => s.requiresSportswear).length, 0);
      const isCurrentActiveWeek = weekMonday === currentRealWeekMonday;

      // Filtrar días a mostrar en el modo Timeline
      const daysWithClasses = weekDays.filter(d => d.sessions.length > 0);
      const visibleTimelineDays = state.selectedDayFilterInWeek === 'ALL'
        ? (daysWithClasses.length > 0 ? daysWithClasses : weekDays)
        : weekDays.filter(d => d.dateISO === state.selectedDayFilterInWeek);

      // Rejilla horaria proporcional (08:00 a 21:00)
      const START_HOUR = 8;
      const END_HOUR = 21;
      const HOUR_HEIGHT_PX = 64;
      const TOTAL_GRID_HEIGHT = (END_HOUR - START_HOUR) * HOUR_HEIGHT_PX;
      const hoursTicks = [];
      for (let h = START_HOUR; h <= END_HOUR; h++) hoursTicks.push(h);

      function layoutDayTimedSessions(sessions) {
        const sorted = [...sessions].sort((a, b) => a.startMinutes - b.startMinutes || (b.endMinutes - a.endMinutes));
        const items = sorted.map(s => ({ session: s, col: 0, totalCols: 1 }));
        for (let i = 0; i < items.length; i++) {
          const overlapping = [items[i]];
          for (let j = 0; j < items.length; j++) {
            if (i === j) continue;
            const a = items[i].session;
            const b = items[j].session;
            if (a.startMinutes < b.endMinutes && a.endMinutes > b.startMinutes) overlapping.push(items[j]);
          }
          if (overlapping.length > 1) {
            overlapping.sort((x, y) => x.session.startMinutes - y.session.startMinutes || x.session.id.localeCompare(y.session.id));
            overlapping.forEach((it, idx) => { it.col = idx; it.totalCols = overlapping.length; });
          }
        }
        return items;
      }

      return `
        <div class="space-y-4">
          <!-- 1. Carrusel de Semanas Lectivas del Curso (Touch-friendly en móvil) -->
          <div class="ue-card rounded-2xl p-3 flex items-center gap-2 overflow-x-auto no-scrollbar">
            <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 shrink-0 pl-1">
              Semanas con clase:
            </span>
            ${activeWeeks.map((w, idx) => {
              const isSelected = w.mondayISO === weekMonday;
              const isNow = w.mondayISO === currentRealWeekMonday;
              return `
                <button
                  onclick="window.appActions.setWeekStart('${w.mondayISO}')"
                  class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 transition-all cursor-pointer flex items-center gap-1.5 ${isSelected ? 'bg-[#060E1E] text-white shadow-sm' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}"
                >
                  ${isNow ? `<span class="w-2 h-2 rounded-full bg-[#E30613]"></span>` : ''}
                  <span>Sem ${idx + 1} · ${formatDayMonthES(w.mondayISO)}</span>
                  <span class="font-mono-tech px-1.5 py-0.2 rounded text-xs ${isSelected ? 'bg-white/15 text-[#FEBE10]' : 'bg-white text-slate-600'}">${w.hours}h</span>
                </button>
              `;
            }).join('')}
          </div>

          <!-- 2. Cabecera de la Semana Activa + Strip Interactivo de los 7 Días (Lunes a Domingo) -->
          <div class="ue-card rounded-3xl p-4 sm:p-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100">
              <div>
                <div class="flex flex-wrap items-center gap-2 mb-1">
                  ${isCurrentActiveWeek ? `
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-[#E30613] text-white">
                      SEMANA ACTUAL EN CURSO
                    </span>
                  ` : ''}
                  <span class="text-xs font-mono-tech font-bold text-slate-500">
                    ${weekTotalSessions} sesiones · ${weekTotalHours} horas lectivas${weekSportswearCount > 0 ? ` · ${weekSportswearCount} con ropa deportiva` : ''}
                  </span>
                </div>
                <h3 class="text-base sm:text-xl font-extrabold text-[#060E1E]">
                  Del ${formatFullDateES(weekMonday)} al ${formatFullDateES(addDaysISO(weekMonday, 6))}
                </h3>
              </div>

              <!-- Conmutador de modo semanal: Tarjetas / Timeline vs Rejilla Horaria 7 Días -->
              <div class="flex items-center gap-2 self-start sm:self-auto">
                <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200/80 text-xs">
                  <button
                    onclick="window.appActions.setWeekSubMode('TIMELINE')"
                    class="px-3 py-1.5 rounded-lg font-extrabold transition-all cursor-pointer flex items-center gap-1.5 ${state.weekSubMode === 'TIMELINE' ? 'bg-[#060E1E] text-white shadow-2xs' : 'text-slate-600 hover:text-slate-900'}"
                  >
                    ${ICONS.list}
                    <span>Tarjetas por Día</span>
                  </button>
                  <button
                    onclick="window.appActions.setWeekSubMode('GRID')"
                    class="px-3 py-1.5 rounded-lg font-extrabold transition-all cursor-pointer flex items-center gap-1.5 ${state.weekSubMode === 'GRID' ? 'bg-[#060E1E] text-white shadow-2xs' : 'text-slate-600 hover:text-slate-900'}"
                  >
                    ${ICONS.grid}
                    <span>Rejilla Horaria</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- Strip de 7 Días (L M X J V S D) estilo App Móvil Nativa -->
            <div class="mt-4">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">
                  Toca un día para aislarlo o ver toda la semana:
                </span>
                ${state.selectedDayFilterInWeek !== 'ALL' ? `
                  <button
                    onclick="window.appActions.setDayFilterInWeek('ALL')"
                    class="text-xs font-extrabold text-[#E30613] hover:underline cursor-pointer"
                  >
                    Ver todos los días de la semana (${weekTotalSessions})
                  </button>
                ` : ''}
              </div>

              <div class="grid grid-cols-7 gap-1.5 sm:gap-2.5">
                ${weekDays.map(d => {
                  const isToday = d.dateISO === todayISO;
                  const isSelectedDay = state.selectedDayFilterInWeek === d.dateISO;
                  const hasClasses = d.sessions.length > 0;
                  const uniqueBlocks = [...new Set(d.sessions.map(s => s.blockId))];

                  return `
                    <button
                      onclick="window.appActions.setDayFilterInWeek('${isSelectedDay ? 'ALL' : d.dateISO}')"
                      class="rounded-2xl p-2 sm:p-3 border text-center transition-all cursor-pointer flex flex-col items-center justify-between ${
                        isSelectedDay
                          ? 'bg-[#060E1E] text-white border-[#060E1E] shadow-md scale-[1.02]'
                          : isToday
                            ? 'bg-[#FFF5F5] text-[#060E1E] border-[#E30613] ring-2 ring-[#E30613]/15'
                            : hasClasses
                              ? 'bg-white hover:bg-slate-50 text-[#060E1E] border-slate-200 shadow-2xs'
                              : 'bg-slate-50/70 text-slate-400 border-slate-100'
                      }"
                    >
                      <span class="text-xs font-extrabold uppercase tracking-wider ${isSelectedDay ? 'text-[#FEBE10]' : isToday ? 'text-[#E30613]' : ''}">
                        <span class="sm:hidden">${d.dayInitial}</span>
                        <span class="hidden sm:inline">${d.dayShort}</span>
                      </span>
                      <span class="text-base sm:text-xl font-black my-0.5 font-mono-tech">
                        ${d.dayNumber}
                      </span>
                      <div class="flex items-center justify-center gap-1 min-h-[16px]">
                        ${hasClasses ? `
                          ${uniqueBlocks.map(bId => `
                            <span class="w-2 h-2 rounded-full" style="background-color: ${BLOCKS_CONFIG[bId]?.color || '#001A57'};"></span>
                          `).join('')}
                          <span class="hidden sm:inline text-xs font-mono-tech font-bold ${isSelectedDay ? 'text-slate-200' : 'text-slate-500'}">${d.totalHours}h</span>
                        ` : `
                          <span class="text-xs opacity-40">—</span>
                        `}
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <!-- 3. Contenido Principal de la Semana: MODO TARJETAS CRONOLÓGICAS (TIMELINE) vs MODO REJILLA HORARIA (GRID) -->
          ${state.weekSubMode === 'TIMELINE' ? `
            ${daysWithClasses.length === 0 ? `
              <div class="ue-card rounded-3xl p-8 text-center">
                <div class="text-base font-extrabold text-[#060E1E] mb-1">No hay clases programadas en esta semana con los filtros actuales</div>
                <p class="text-xs text-slate-500 mb-4">Selecciona otra semana lectiva en la barra superior o restablece los filtros.</p>
                <button
                  onclick="window.appActions.resetFiltersAndGoToCurrentWeek()"
                  class="px-4 py-2 rounded-xl bg-[#E30613] text-white text-xs font-extrabold cursor-pointer"
                >
                  Volver a la Semana Actual
                </button>
              </div>
            ` : `
              <div class="space-y-4">
                ${visibleTimelineDays.filter(d => d.sessions.length > 0).map(d => {
                  const isToday = d.dateISO === todayISO;
                  return `
                    <section class="ue-card rounded-3xl p-4 sm:p-6 border ${isToday ? 'border-[#E30613]/50 ring-2 ring-[#E30613]/10' : 'border-slate-200/80'}">
                      <div class="flex flex-wrap items-center justify-between gap-2 pb-3.5 mb-4 border-b border-slate-100">
                        <div class="flex items-center gap-3">
                          <div class="w-11 h-11 rounded-2xl ${isToday ? 'bg-[#E30613] text-white' : 'bg-[#060E1E] text-[#FEBE10]'} flex flex-col items-center justify-center font-mono-tech leading-none shadow-xs">
                            <span class="text-xs font-bold uppercase">${d.dayShort}</span>
                            <span class="text-base font-black mt-0.5">${d.dayNumber}</span>
                          </div>
                          <div>
                            <div class="flex items-center gap-2">
                              <h4 class="text-base sm:text-lg font-extrabold text-[#060E1E]">
                                ${escapeHtml(formatFullDateES(d.dateISO))}
                              </h4>
                              ${isToday ? `<span class="px-2 py-0.5 rounded-full text-xs font-black bg-[#E30613]/10 text-[#E30613]">HOY</span>` : ''}
                            </div>
                            <div class="text-xs text-slate-500 font-medium">
                              ${d.sessions.length} ${d.sessions.length === 1 ? 'sesión programada' : 'sesiones programadas'} · <strong>${d.totalHours} horas lectivas</strong>
                            </div>
                          </div>
                        </div>

                        ${d.hasSportswear ? `
                          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#FFFBEB] border border-[#FEBE10] text-xs font-extrabold text-[#92400E]">
                            ${ICONS.shirt}
                            <span>Día con Ropa Deportiva</span>
                          </div>
                        ` : ''}
                      </div>

                      <div class="grid grid-cols-1 lg:grid-cols-2 gap-3.5">
                        ${d.sessions.map(s => renderSessionCardFuturistic(s, false)).join('')}
                      </div>
                    </section>
                  `;
                }).join('')}
              </div>
            `}
          ` : `
            <!-- MODO REJILLA HORARIA PROPORCIONAL (08:00 a 21:00) -->
            <div class="ue-card rounded-3xl overflow-hidden border border-slate-200">
              <div class="overflow-x-auto">
                <div class="min-w-[980px]">
                  <div class="grid grid-cols-[72px_repeat(7,minmax(0,1fr))] ue-dark-glass text-white border-b border-slate-200">
                    <div class="p-2.5 text-center text-xs font-mono-tech font-bold text-slate-400 border-r border-white/10 flex items-center justify-center">
                      HORA
                    </div>
                    ${weekDays.map(d => {
                      const isToday = d.dateISO === todayISO;
                      return `
                        <div class="p-2.5 text-center border-r border-white/10 ${isToday ? 'bg-[#E30613]/25' : ''}">
                          <div class="text-xs font-bold uppercase tracking-wider ${d.index >= 4 ? 'text-[#FEBE10]' : 'text-slate-300'}">${d.dayName}</div>
                          <div class="text-sm font-black font-mono-tech mt-0.5">${d.dayNumber} ${d.monthShort}</div>
                          ${d.totalHours > 0 ? `<div class="mt-1 inline-block px-2 py-0.5 rounded-full text-xs font-bold bg-white/15 text-[#FEBE10]">${d.totalHours}h</div>` : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>

                  <div class="grid grid-cols-[72px_repeat(7,minmax(0,1fr))] relative" style="height: ${TOTAL_GRID_HEIGHT}px;">
                    <div class="border-r border-slate-200 bg-slate-50/90 select-none">
                      ${hoursTicks.slice(0, -1).map(h => `
                        <div class="border-b border-slate-200/70 pr-2 pt-1 text-right text-xs font-mono-tech font-bold text-slate-400" style="height: ${HOUR_HEIGHT_PX}px;">
                          ${String(h).padStart(2, '0')}:00
                        </div>
                      `).join('')}
                    </div>

                    ${weekDays.map(d => {
                      const positioned = layoutDayTimedSessions(d.timedSessions);
                      return `
                        <div class="border-r border-slate-200/80 relative bg-white">
                          ${hoursTicks.slice(0, -1).map(() => `
                            <div class="border-b border-slate-100" style="height: ${HOUR_HEIGHT_PX}px;"></div>
                          `).join('')}

                          ${positioned.map(({ session: s, col, totalCols }) => {
                            const startOffsetHours = Math.max(0, (s.startMinutes - START_HOUR * 60) / 60);
                            const durationH = Math.max(0.8, (s.endMinutes - s.startMinutes) / 60);
                            const topPx = Math.round(startOffsetHours * HOUR_HEIGHT_PX);
                            const heightPx = Math.max(52, Math.round(durationH * HOUR_HEIGHT_PX) - 3);
                            const widthPct = 100 / totalCols;
                            const leftPct = col * widthPct;
                            const bCfg = BLOCKS_CONFIG[s.blockId] || BLOCKS_CONFIG.INSTITUCIONAL;
                            const mCfg = MODULES_CONFIG[s.moduleId] || MODULES_CONFIG.EVENTO;

                            return `
                              <div
                                onclick="window.appActions.openSessionModal('${s.id}')"
                                style="
                                  top: ${topPx}px;
                                  height: ${heightPx}px;
                                  left: calc(${leftPct}% + 2px);
                                  width: calc(${widthPct}% - 4px);
                                  background-color: ${bCfg.bgLight};
                                  border-left: 4px solid ${bCfg.color};
                                  border-top: 1px solid ${bCfg.border};
                                  border-right: 1px solid ${bCfg.border};
                                  border-bottom: 1px solid ${bCfg.border};
                                "
                                class="absolute rounded-xl p-2 shadow-xs hover:shadow-lg hover:z-20 transition-all cursor-pointer overflow-y-auto flex flex-col justify-between"
                              >
                                <div>
                                  <div class="flex items-center justify-between gap-1 mb-1">
                                    <span class="font-mono-tech text-xs font-bold text-[#060E1E] bg-white/90 px-1.5 py-0.5 rounded border border-slate-200/80">
                                      ${escapeHtml(s.startTime)}–${escapeHtml(s.endTime)}
                                    </span>
                                    <span class="px-1.5 py-0.5 rounded text-xs font-extrabold text-white" style="background-color: ${mCfg.color};">
                                      ${escapeHtml(s.moduleId)}
                                    </span>
                                  </div>
                                  <div class="text-xs font-extrabold text-[#060E1E] leading-snug mb-1">
                                    ${escapeHtml(s.displayTitle)}
                                  </div>
                                  ${s.aula ? `<div class="text-xs text-slate-600 truncate">${escapeHtml(s.aula)}</div>` : ''}
                                </div>
                                <div class="pt-1 flex items-center justify-between gap-1">
                                  <span class="text-xs font-bold text-slate-500">${s.durationHours}h</span>
                                  ${renderSportswearBadge(s, true)}
                                </div>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            </div>
          `}
        </div>
      `;
    }

    // ============================================================================
    // 8. VISTA DE MES (COMPACTA INTERACTIVA EN MÓVIL + CUADRÍCULA COMPLETA EN PC)
    // ============================================================================
    function renderMonthView(filteredSessions) {
      const year = state.currentYear;
      const month = state.currentMonth;
      const firstDayOfMonth = new Date(Date.UTC(year, month, 1));
      const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
      const startOffset = (firstDayOfMonth.getUTCDay() + 6) % 7;
      const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

      const sessionsByDate = new Map();
      for (const s of filteredSessions) {
        if (!sessionsByDate.has(s.dateISO)) sessionsByDate.set(s.dateISO, []);
        sessionsByDate.get(s.dateISO).push(s);
      }

      const todayISO = getRealTodayISO();
      const desktopCells = [];
      const mobileCells = [];

      for (let i = 0; i < totalCells; i++) {
        const dayNum = i - startOffset + 1;
        const cellDate = new Date(Date.UTC(year, month, dayNum));
        const cellYear = cellDate.getUTCFullYear();
        const cellMonth = cellDate.getUTCMonth();
        const cellDay = cellDate.getUTCDate();
        const dateISO = `${cellYear}-${String(cellMonth + 1).padStart(2, '0')}-${String(cellDay).padStart(2, '0')}`;
        const isCurrentMonth = cellMonth === month;
        const isToday = dateISO === todayISO;
        const isSelectedMobile = state.selectedDayInMonthMobile === dateISO;
        const daySessions = sessionsByDate.get(dateISO) || [];
        const dayHours = Math.round(daySessions.reduce((acc, s) => acc + s.durationHours, 0) * 10) / 10;
        const uniqueBlocks = [...new Set(daySessions.map(s => s.blockId))];

        // Celda compacta para Móvil (7 columnas sin desbordamiento)
        mobileCells.push(`
          <button
            onclick="window.appActions.selectMonthDayMobile('${dateISO}')"
            class="aspect-square p-1 rounded-2xl border flex flex-col items-center justify-between transition-all cursor-pointer ${
              !isCurrentMonth
                ? 'opacity-30 bg-slate-50 border-transparent'
                : isSelectedMobile
                  ? 'bg-[#060E1E] text-white border-[#060E1E] shadow-md'
                  : isToday
                    ? 'bg-[#FFF5F5] text-[#E30613] border-[#E30613]'
                    : daySessions.length > 0
                      ? 'bg-white text-[#060E1E] border-slate-200 shadow-2xs'
                      : 'bg-slate-50/60 text-slate-500 border-slate-100'
            }"
          >
            <span class="text-xs font-mono-tech font-extrabold">${cellDay}</span>
            <div class="flex items-center gap-0.5">
              ${uniqueBlocks.slice(0, 3).map(bId => `
                <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${BLOCKS_CONFIG[bId]?.color || '#001A57'};"></span>
              `).join('')}
            </div>
            <span class="text-xs font-mono-tech font-bold ${isSelectedMobile ? 'text-[#FEBE10]' : 'text-slate-400'}">
              ${dayHours > 0 ? `${dayHours}h` : ''}
            </span>
          </button>
        `);

        // Celda completa para Escritorio
        desktopCells.push(`
          <div class="min-h-[165px] p-2.5 border-b border-r border-slate-200/80 flex flex-col justify-between transition-colors ${isCurrentMonth ? 'bg-white' : 'bg-slate-50/60 text-slate-400'} ${isToday ? 'ring-2 ring-inset ring-[#E30613] bg-red-50/10' : ''}">
            <div>
              <div class="flex items-center justify-between gap-1 mb-2">
                <span class="w-7 h-7 rounded-xl font-mono-tech flex items-center justify-center text-xs font-extrabold ${isToday ? 'bg-[#E30613] text-white' : isCurrentMonth ? 'text-[#060E1E] bg-slate-100' : 'text-slate-400'}">
                  ${cellDay}
                </span>
                ${daySessions.length > 0 ? `
                  <span class="px-2 py-0.5 rounded-md font-mono-tech text-xs font-bold bg-[#060E1E]/6 text-[#060E1E]">
                    ${dayHours}h
                  </span>
                ` : ''}
              </div>

              <div class="space-y-1.5">
                ${daySessions.map(s => {
                  const bCfg = BLOCKS_CONFIG[s.blockId] || BLOCKS_CONFIG.INSTITUCIONAL;
                  const mCfg = MODULES_CONFIG[s.moduleId] || MODULES_CONFIG.EVENTO;
                  const tLabel = s.startTime && s.endTime ? `${s.startTime}–${s.endTime}` : 'Por confirmar';
                  return `
                    <div
                      onclick="window.appActions.openSessionModal('${s.id}')"
                      class="rounded-xl p-2 border-l-4 shadow-2xs hover:shadow-md transition-all cursor-pointer text-left"
                      style="background-color: ${bCfg.bgLight}; border-left-color: ${bCfg.color}; border-top: 1px solid ${bCfg.border}; border-right: 1px solid ${bCfg.border}; border-bottom: 1px solid ${bCfg.border};"
                    >
                      <div class="flex items-center justify-between gap-1 mb-1">
                        <span class="font-mono-tech text-xs font-bold text-[#060E1E]">${escapeHtml(tLabel)}</span>
                        <span class="px-1.5 py-0.2 rounded text-xs font-extrabold text-white" style="background-color: ${mCfg.color};">${escapeHtml(s.moduleId)}</span>
                      </div>
                      <div class="text-xs font-extrabold text-[#060E1E] leading-snug mb-1">${escapeHtml(s.displayTitle)}</div>
                      ${s.aula ? `<div class="text-xs text-slate-600 truncate">${escapeHtml(s.aula)}</div>` : ''}
                      <div class="mt-1 flex items-center justify-between gap-1">
                        <span class="text-xs font-semibold text-slate-500">${escapeHtml(s.profesores || '')}</span>
                        ${renderSportswearBadge(s, true)}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `);
      }

      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthSessionsAll = filteredSessions.filter(s => s.dateISO.startsWith(monthPrefix));
      const selectedMobileSessions = sessionsByDate.get(state.selectedDayInMonthMobile) || [];

      return `
        <div>
          <!-- Vista Móvil de Mes: Calendario Compacto de 7 Columnas + Tarjetas del Día / Mes -->
          <div class="md:hidden space-y-4">
            <div class="ue-card rounded-3xl p-3.5">
              <div class="grid grid-cols-7 gap-1 mb-2 text-center">
                ${DAYS_INITIAL_ES.map((dInit, idx) => `
                  <div class="text-xs font-extrabold ${idx >= 4 ? 'text-[#E30613]' : 'text-slate-400'}">${dInit}</div>
                `).join('')}
              </div>
              <div class="grid grid-cols-7 gap-1.5">
                ${mobileCells.join('')}
              </div>
            </div>

            <!-- Detalle de sesiones del día seleccionado o del mes en móvil -->
            <div class="space-y-3">
              ${selectedMobileSessions.length > 0 ? `
                <div class="flex items-center justify-between px-1">
                  <h4 class="text-sm font-extrabold text-[#060E1E]">
                    Sesiones del ${escapeHtml(formatFullDateES(state.selectedDayInMonthMobile))}
                  </h4>
                  <span class="text-xs font-mono-tech font-bold text-[#E30613]">${selectedMobileSessions.length} sesiones</span>
                </div>
                ${selectedMobileSessions.map(s => renderSessionCardFuturistic(s, false)).join('')}
              ` : `
                <div class="px-1">
                  <h4 class="text-sm font-extrabold text-[#060E1E] mb-2">
                    Todas las sesiones de ${MONTHS_ES[month]} ${year} (${monthSessionsAll.length})
                  </h4>
                  <div class="space-y-3">
                    ${monthSessionsAll.map(s => `
                      <div>
                        <div class="text-xs font-mono-tech font-bold text-slate-500 mb-1 px-1">
                          ${escapeHtml(formatFullDateES(s.dateISO))}
                        </div>
                        ${renderSessionCardFuturistic(s, false)}
                      </div>
                    `).join('')}
                  </div>
                </div>
              `}
            </div>
          </div>

          <!-- Vista Escritorio de Mes: Cuadrícula Completa 7 Columnas -->
          <div class="hidden md:block ue-card rounded-3xl overflow-hidden border border-slate-200">
            <div class="grid grid-cols-7 ue-dark-glass text-white">
              ${DAYS_ES.map((dName, idx) => `
                <div class="py-3 px-2 text-center text-xs font-extrabold uppercase tracking-wider ${idx >= 4 ? 'text-[#FEBE10]' : 'text-white'}">
                  ${dName}
                </div>
              `).join('')}
            </div>
            <div class="grid grid-cols-7 border-l border-t border-slate-200">
              ${desktopCells.join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderAgendaView(filteredSessions) {
      return `
        <div class="space-y-3">
          <div class="ue-card rounded-3xl p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h3 class="text-base font-extrabold text-[#060E1E]">
                Agenda Académica Completa (${filteredSessions.length} sesiones)
              </h3>
              <p class="text-xs text-slate-500">
                Listado cronológico íntegro sincronizado en tiempo real con el Excel de SharePoint.
              </p>
            </div>
            <button
              onclick="window.appActions.exportSessionsCSV()"
              class="px-4 py-2 rounded-xl bg-[#060E1E] hover:bg-[#001A57] text-[#FEBE10] text-xs font-extrabold transition-all cursor-pointer self-start sm:self-auto"
            >
              Exportar Agenda CSV
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
            ${filteredSessions.map(s => `
              <div>
                <div class="text-xs font-mono-tech font-bold text-slate-500 mb-1 px-1">
                  ${escapeHtml(formatFullDateES(s.dateISO))}
                </div>
                ${renderSessionCardFuturistic(s, false)}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ============================================================================
    // 9. PANEL DE ESTADÍSTICAS Y CARGA LECTIVA (DISEÑO FUTURISTA UE · REAL MADRID)
    // ============================================================================
    function buildDonutSvg(segments, totalValue, centerTopText, centerSubText) {
      const size = 196;
      const stroke = 24;
      const radius = (size - stroke) / 2;
      const circumference = 2 * Math.PI * radius;
      let accumPct = 0;

      const circles = segments.filter(seg => seg.value > 0).map(seg => {
        const pct = totalValue > 0 ? seg.value / totalValue : 0;
        const dash = pct * circumference;
        const offset = -accumPct * circumference;
        accumPct += pct;
        return `
          <circle
            cx="${size / 2}"
            cy="${size / 2}"
            r="${radius}"
            fill="transparent"
            stroke="${seg.color}"
            stroke-width="${stroke}"
            stroke-dasharray="${dash} ${circumference}"
            stroke-dashoffset="${offset}"
            transform="rotate(-90 ${size / 2} ${size / 2})"
          >
            <title>${escapeHtml(seg.label)}: ${seg.value}h (${Math.round(pct * 1000) / 10}%)</title>
          </circle>
        `;
      }).join('');

      return `
        <div class="relative inline-flex items-center justify-center">
          <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
            <circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="transparent" stroke="#E2E8F0" stroke-width="${stroke}" />
            ${circles}
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-3 pointer-events-none">
            <div class="text-xl font-black font-mono-tech text-[#060E1E] leading-none">${escapeHtml(centerTopText)}</div>
            <div class="text-xs font-bold text-slate-400 mt-1">${escapeHtml(centerSubText)}</div>
          </div>
        </div>
      `;
    }
