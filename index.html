    // ============================================================================
    // 7. VISTAS DEL CALENDARIO (MES, SEMANA Y AGENDA ESTILO GOOGLE CALENDAR)
    // ============================================================================
    function renderCalendarToolbar(filteredSessions) {
      const groupSessions = getSessionsForSelectedGroup();

      // Obtener todos los meses que tienen sesiones en el Excel para acceso rápido en 1 clic
      const activeMonthsSet = new Set(groupSessions.map(s => s.dateISO.slice(0, 7)));
      const activeMonths = [...activeMonthsSet].sort();

      const currentYM = `${state.currentYear}-${String(state.currentMonth + 1).padStart(2, '0')}`;
      const titleText = state.calendarView === 'MONTH'
        ? `${MONTHS_ES[state.currentMonth]} ${state.currentYear}`
        : state.calendarView === 'WEEK'
          ? `Semana del ${formatShortDateES(state.currentWeekStartISO)} al ${formatShortDateES(addDaysISO(state.currentWeekStartISO, 6))}`
          : `Agenda Completa del Curso (${filteredSessions.length} sesiones)`;

      return `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/90 p-4 mb-4 space-y-3.5">
          <!-- Fila 1: Navegación estilo Google Calendar + Selector de Vista + Buscador -->
          <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
              <button
                onclick="window.appActions.goToToday()"
                class="px-3.5 py-2 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-xs font-extrabold text-[#001A57] shadow-xs transition-all cursor-pointer"
              >
                📍 Hoy (17 Oct 2026)
              </button>
              <div class="inline-flex items-center rounded-xl border border-slate-200 bg-slate-50 p-0.5">
                <button
                  onclick="window.appActions.navigateCalendar(-1)"
                  class="px-3 py-1.5 rounded-lg hover:bg-white text-slate-700 font-bold text-sm transition-all cursor-pointer"
                  title="Anterior"
                >
                  ◀
                </button>
                <button
                  onclick="window.appActions.navigateCalendar(1)"
                  class="px-3 py-1.5 rounded-lg hover:bg-white text-slate-700 font-bold text-sm transition-all cursor-pointer"
                  title="Siguiente"
                >
                  ▶
                </button>
              </div>
              <h2 class="text-lg md:text-xl font-extrabold text-[#001A57] ml-1">
                ${escapeHtml(titleText)}
              </h2>

              <!-- Saltos rápidos a los meses lectivos del Excel -->
              <div class="flex flex-wrap items-center gap-1 ml-2">
                ${activeMonths.map(ym => {
                  const [y, m] = ym.split('-').map(Number);
                  const isCurrent = state.calendarView === 'MONTH' && ym === currentYM;
                  return `
                    <button
                      onclick="window.appActions.jumpToMonth(${y}, ${m - 1})"
                      class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${isCurrent ? 'bg-[#001A57] text-[#FEBE10] shadow-xs' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}"
                    >
                      ${MONTHS_ES[m - 1].slice(0, 3)} ${y}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Derecha: Buscador en tiempo real + Selector de Vista (Mes / Semana / Agenda) -->
            <div class="flex flex-wrap items-center gap-2.5">
              <div class="relative flex-1 sm:w-64">
                <input
                  type="text"
                  value="${escapeHtml(state.searchQuery)}"
                  oninput="window.appActions.setSearchQuery(this.value)"
                  placeholder="🔍 Buscar asignatura, profesor, aula, módulo..."
                  class="w-full pl-3 pr-8 py-2 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white text-xs font-medium text-slate-800 focus:outline-none focus:border-[#001A57]"
                />
                ${state.searchQuery ? `
                  <button
                    onclick="window.appActions.setSearchQuery('')"
                    class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-slate-700 font-bold"
                  >
                    ✕
                  </button>
                ` : ''}
              </div>

              <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200">
                <button
                  onclick="window.appActions.setCalendarView('MONTH')"
                  class="px-3.5 py-1.5 rounded-lg text-xs font-extrabold transition-all cursor-pointer ${state.calendarView === 'MONTH' ? 'bg-[#001A57] text-white shadow-xs' : 'text-slate-600 hover:text-[#001A57]'}"
                >
                  🗓️ Mes
                </button>
                <button
                  onclick="window.appActions.setCalendarView('WEEK')"
                  class="px-3.5 py-1.5 rounded-lg text-xs font-extrabold transition-all cursor-pointer ${state.calendarView === 'WEEK' ? 'bg-[#001A57] text-white shadow-xs' : 'text-slate-600 hover:text-[#001A57]'}"
                >
                  ⏰ Semana
                </button>
                <button
                  onclick="window.appActions.setCalendarView('AGENDA')"
                  class="px-3.5 py-1.5 rounded-lg text-xs font-extrabold transition-all cursor-pointer ${state.calendarView === 'AGENDA' ? 'bg-[#001A57] text-white shadow-xs' : 'text-slate-600 hover:text-[#001A57]'}"
                >
                  📋 Agenda / Excel
                </button>
              </div>
            </div>
          </div>

          <!-- Fila 2: Filtros Rápidos por BLOQUE, por MÓDULO (M1-M8) y Detector de Ropa Deportiva -->
          <div class="pt-3 border-t border-slate-100 flex flex-col lg:flex-row lg:items-center justify-between gap-2.5">
            <!-- Filtro por Bloques -->
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 mr-1">Bloques:</span>
              <button
                onclick="window.appActions.setCalendarBlockFilter('ALL')"
                class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${state.calendarBlockFilter === 'ALL' ? 'bg-[#001A57] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}"
              >
                Todos (${groupSessions.length})
              </button>
              <button
                onclick="window.appActions.setCalendarBlockFilter('ENTRENAMIENTO')"
                class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${state.calendarBlockFilter === 'ENTRENAMIENTO' ? 'bg-[#E30613] text-white shadow-xs' : 'bg-[#FEF2F2] text-[#991B1B] border border-[#FCA5A5]/60 hover:bg-[#FEE2E2]'}"
              >
                🏋️‍♂️ Entrenamiento (M1–M3)
              </button>
              <button
                onclick="window.appActions.setCalendarBlockFilter('NUTRICION')"
                class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${state.calendarBlockFilter === 'NUTRICION' ? 'bg-[#0D9488] text-white shadow-xs' : 'bg-[#F0FDFA] text-[#115E59] border border-[#5EEAD4]/60 hover:bg-[#CCFBF1]'}"
              >
                🥗 Nutrición (M4–M6 + ISAK)
              </button>
              <button
                onclick="window.appActions.setCalendarBlockFilter('PRACTICAS')"
                class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${state.calendarBlockFilter === 'PRACTICAS' ? 'bg-[#D97706] text-white shadow-xs' : 'bg-[#FFFBEB] text-[#92400E] border border-[#FCD34D]/60 hover:bg-[#FEF3C7]'}"
              >
                💼 Prácticas (M7)
              </button>
              <button
                onclick="window.appActions.setCalendarBlockFilter('TFG')"
                class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${state.calendarBlockFilter === 'TFG' ? 'bg-[#4F46E5] text-white shadow-xs' : 'bg-[#EEF2FF] text-[#3730A3] border border-[#A5B4FC]/60 hover:bg-[#E0E7FF]'}"
              >
                🎓 TFG/TFM (M8)
              </button>
              <button
                onclick="window.appActions.setCalendarBlockFilter('INSTITUCIONAL')"
                class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${state.calendarBlockFilter === 'INSTITUCIONAL' ? 'bg-[#0F2537] text-[#FEBE10] shadow-xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}"
              >
                🏛️ Eventos
              </button>
            </div>

            <!-- Filtro por Módulos M1..M8 + Filtro Ropa Deportiva -->
            <div class="flex flex-wrap items-center gap-1">
              <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 mr-1">Módulos:</span>
              <button
                onclick="window.appActions.setCalendarModuleFilter('ALL')"
                class="px-2 py-1 rounded-md text-xs font-bold cursor-pointer ${state.calendarModuleFilter === 'ALL' ? 'bg-[#001A57] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}"
              >
                M1–M8
              </button>
              ${['M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7', 'M8', 'ISAK'].map(mId => {
                const cfg = MODULES_CONFIG[mId];
                const count = groupSessions.filter(s => s.moduleId === mId).length;
                const active = state.calendarModuleFilter === mId;
                return `
                  <button
                    onclick="window.appActions.setCalendarModuleFilter('${mId}')"
                    title="${escapeHtml(cfg.fullLabel)} (${count} sesiones)"
                    class="px-2 py-1 rounded-md text-xs font-extrabold transition-all cursor-pointer ${active ? 'ring-2 ring-offset-1 ring-[#001A57] text-white' : 'hover:opacity-90'}"
                    style="background-color: ${active ? cfg.color : cfg.light}; color: ${active ? '#FFFFFF' : cfg.text};"
                  >
                    ${mId}${count > 0 ? ` (${count})` : ''}
                  </button>
                `;
              }).join('')}

              <button
                onclick="window.appActions.toggleOnlySportswear()"
                class="ml-1 px-2.5 py-1 rounded-full text-xs font-extrabold border transition-all cursor-pointer ${state.onlySportswearFilter ? 'bg-[#FEBE10] text-[#001A57] border-[#001A57] ring-2 ring-[#FEBE10]/50 shadow-xs' : 'bg-amber-50 text-amber-900 border-amber-300 hover:bg-amber-100'}"
              >
                👟👕 Solo Ropa Deportiva (${groupSessions.filter(s => s.requiresSportswear).length})
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderMonthView(filteredSessions) {
      const year = state.currentYear;
      const month = state.currentMonth;
      const firstDayOfMonth = new Date(Date.UTC(year, month, 1));
      const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();

      // Lunes = 0 ... Domingo = 6
      const startOffset = (firstDayOfMonth.getUTCDay() + 6) % 7;
      const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

      const sessionsByDate = new Map();
      for (const s of filteredSessions) {
        if (!sessionsByDate.has(s.dateISO)) sessionsByDate.set(s.dateISO, []);
        sessionsByDate.get(s.dateISO).push(s);
      }

      const todayISO = '2026-10-17'; // Fecha actual del sistema
      const cellsHtml = [];

      for (let i = 0; i < totalCells; i++) {
        const dayNum = i - startOffset + 1;
        const cellDate = new Date(Date.UTC(year, month, dayNum));
        const cellYear = cellDate.getUTCFullYear();
        const cellMonth = cellDate.getUTCMonth();
        const cellDay = cellDate.getUTCDate();
        const dateISO = `${cellYear}-${String(cellMonth + 1).padStart(2, '0')}-${String(cellDay).padStart(2, '0')}`;
        const isCurrentMonth = cellMonth === month;
        const isToday = dateISO === todayISO;
        const daySessions = sessionsByDate.get(dateISO) || [];
        const dayHours = Math.round(daySessions.reduce((acc, s) => acc + s.durationHours, 0) * 10) / 10;

        cellsHtml.push(`
          <div class="min-h-[155px] md:min-h-[185px] p-2 border-b border-r border-slate-200 flex flex-col justify-between transition-colors ${isCurrentMonth ? 'bg-white' : 'bg-slate-50/70 text-slate-400'} ${isToday ? 'ring-2 ring-inset ring-[#E30613] bg-red-50/15' : ''} ${daySessions.length > 0 && isCurrentMonth ? 'bg-slate-50/30' : ''}">
            <!-- Cabecera del día -->
            <div>
              <div class="flex items-center justify-between gap-1 mb-1.5">
                <div class="flex items-center gap-1.5">
                  <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-extrabold ${isToday ? 'bg-[#E30613] text-white shadow-xs' : isCurrentMonth ? 'text-[#001A57]' : 'text-slate-400'}">
                    ${cellDay}
                  </span>
                  ${isToday ? `<span class="text-xs font-extrabold text-[#E30613] uppercase">Hoy</span>` : ''}
                </div>
                ${daySessions.length > 0 ? `
                  <div class="flex items-center gap-1">
                    <span class="px-1.5 py-0.5 rounded-md text-xs font-bold bg-[#001A57]/10 text-[#001A57]">
                      ${daySessions.length} ${daySessions.length === 1 ? 'sesión' : 'sesiones'}${dayHours > 0 ? ` · ${dayHours}h` : ''}
                    </span>
                  </div>
                ` : ''}
              </div>

              <!-- Tarjetas de sesiones del día -->
              <div class="space-y-1.5">
                ${daySessions.map(s => {
                  const bCfg = BLOCKS_CONFIG[s.blockId] || BLOCKS_CONFIG.INSTITUCIONAL;
                  const mCfg = MODULES_CONFIG[s.moduleId] || MODULES_CONFIG.EVENTO;
                  const timeLabel = s.startTime && s.endTime
                    ? `${s.startTime}–${s.endTime}`
                    : 'Hora por confirmar';
                  return `
                    <div
                      onclick="window.appActions.openSessionModal('${s.id}')"
                      class="group rounded-xl p-2 border-l-4 shadow-xs hover:shadow-md transition-all cursor-pointer text-left relative"
                      style="background-color: ${bCfg.bgLight}; border-color: ${bCfg.color}; border-top: 1px solid ${bCfg.border}; border-right: 1px solid ${bCfg.border}; border-bottom: 1px solid ${bCfg.border};"
                    >
                      <!-- Fila superior: Hora + Badge de Módulo y Bloque -->
                      <div class="flex flex-wrap items-center justify-between gap-1 mb-1">
                        <span class="text-xs font-extrabold text-[#001A57] bg-white/90 px-1.5 py-0.5 rounded border border-slate-200/80">
                          🕒 ${escapeHtml(timeLabel)}${s.durationHours > 0 ? ` (${s.durationHours}h)` : ''}
                        </span>
                        <div class="flex items-center gap-1">
                          <span
                            class="px-1.5 py-0.5 rounded text-xs font-extrabold"
                            style="background-color: ${mCfg.color}; color: #FFFFFF;"
                          >
                            ${escapeHtml(s.moduleId === 'EVENTO' ? 'EVENTO' : s.moduleId)}
                          </span>
                          <span class="text-xs font-bold" style="color: ${bCfg.text};">
                            ${bCfg.emoji} ${escapeHtml(bCfg.shortName)}
                          </span>
                        </div>
                      </div>

                      <!-- Nombre íntegro de la sesión / asignatura -->
                      <div class="text-xs font-extrabold text-[#0F2537] leading-snug mb-1 group-hover:underline">
                        ${escapeHtml(s.displayTitle)}
                      </div>

                      <!-- Aula, Profesor y Grupo -->
                      <div class="text-xs text-slate-600 space-y-0.5">
                        ${s.aula ? `<div class=" font-medium">📍 <span class="text-slate-800">${escapeHtml(s.aula)}</span></div>` : ''}
                        ${s.profesores ? `<div>👤 ${escapeHtml(s.profesores)}</div>` : ''}
                        <div class="flex flex-wrap items-center justify-between gap-1 pt-1">
                          <span class="px-1.5 py-0.5 rounded bg-white/80 text-slate-700 font-bold text-xs border border-slate-200/70">
                            ${s.isCommonToAllMaster ? '🌐 Común Máster' : `👥 ${escapeHtml(s.groupLabel)}`}
                          </span>
                          ${renderSportswearBadge(s, true)}
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            ${daySessions.length > 0 ? `
              <button
                onclick="window.appActions.openWeekForDate('${dateISO}')"
                class="mt-2 w-full py-1 rounded-lg bg-slate-100 hover:bg-[#001A57] text-slate-600 hover:text-white text-xs font-bold transition-colors cursor-pointer"
              >
                Ver en rejilla semanal →
              </button>
            ` : ''}
          </div>
        `);
      }

      return `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <!-- Cabecera de días Lunes a Domingo -->
          <div class="grid grid-cols-7 bg-[#001A57] text-white border-b border-slate-200">
            ${DAYS_ES.map((dName, idx) => `
              <div class="py-2.5 px-2 text-center text-xs font-extrabold uppercase tracking-wider ${idx >= 4 ? 'text-[#FEBE10]' : 'text-white'}">
                <span class="hidden sm:inline">${dName}</span>
                <span class="sm:hidden">${DAYS_SHORT_ES[idx]}</span>
              </div>
            `).join('')}
          </div>

          <!-- Cuadrícula mensual -->
          <div class="grid grid-cols-1 md:grid-cols-7 border-l border-t border-slate-200">
            ${cellsHtml.join('')}
          </div>
        </div>
      `;
    }

    function renderWeekView(filteredSessions) {
      const groupSessions = getSessionsForSelectedGroup();
      const activeWeeksMap = new Map();
      for (const s of groupSessions) {
        const mon = getMondayOfDateISO(s.dateISO);
        if (!activeWeeksMap.has(mon)) {
          activeWeeksMap.set(mon, { mondayISO: mon, count: 0, hours: 0 });
        }
        const w = activeWeeksMap.get(mon);
        w.count += 1;
        w.hours = Math.round((w.hours + s.durationHours) * 10) / 10;
      }
      const activeWeeks = [...activeWeeksMap.values()].sort((a, b) => a.mondayISO.localeCompare(b.mondayISO));

      const weekMonday = state.currentWeekStartISO;
      const weekDays = [];
      for (let i = 0; i < 7; i++) {
        const dISO = addDaysISO(weekMonday, i);
        const [y, m, d] = dISO.split('-').map(Number);
        const daySessions = filteredSessions.filter(s => s.dateISO === dISO);
        weekDays.push({
          index: i,
          dayName: DAYS_ES[i],
          dayShort: DAYS_SHORT_ES[i],
          dateISO: dISO,
          dayNumber: d,
          monthShort: MONTHS_ES[m - 1].slice(0, 3),
          timedSessions: daySessions.filter(s => s.startMinutes !== null && s.endMinutes !== null),
          untimedSessions: daySessions.filter(s => s.startMinutes === null || s.endMinutes === null),
          totalHours: Math.round(daySessions.reduce((a, b) => a + b.durationHours, 0) * 10) / 10
        });
      }

      // Configuración de la rejilla horaria vertical (08:00 a 21:00 = 13 horas)
      const START_HOUR = 8;
      const END_HOUR = 21;
      const HOUR_HEIGHT_PX = 68; // 68px por hora para máxima legibilidad
      const TOTAL_GRID_HEIGHT = (END_HOUR - START_HOUR) * HOUR_HEIGHT_PX;

      const hoursTicks = [];
      for (let h = START_HOUR; h <= END_HOUR; h++) hoursTicks.push(h);

      // Algoritmo de detección de solapamientos por columna (ej. 4 Dic en M13+M14: 12:30-16:30 y 15:00-16:00)
      function layoutDayTimedSessions(sessions) {
        const sorted = [...sessions].sort((a, b) => a.startMinutes - b.startMinutes || (b.endMinutes - a.endMinutes));
        const items = sorted.map(s => ({ session: s, col: 0, totalCols: 1 }));
        for (let i = 0; i < items.length; i++) {
          const overlapping = [items[i]];
          for (let j = 0; j < items.length; j++) {
            if (i === j) continue;
            const a = items[i].session;
            const b = items[j].session;
            if (a.startMinutes < b.endMinutes && a.endMinutes > b.startMinutes) {
              overlapping.push(items[j]);
            }
          }
          if (overlapping.length > 1) {
            overlapping.sort((x, y) => x.session.startMinutes - y.session.startMinutes || x.session.id.localeCompare(y.session.id));
            overlapping.forEach((it, idx) => {
              it.col = idx;
              it.totalCols = overlapping.length;
            });
          }
        }
        return items;
      }

      return `
        <div class="space-y-3">
          <!-- Barra rápida de Semanas con Clase en el Curso -->
          <div class="bg-white rounded-2xl p-3 border border-slate-200 shadow-xs flex items-center gap-2 overflow-x-auto">
            <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 shrink-0">
              Semanas lectivas:
            </span>
            ${activeWeeks.map((w, idx) => {
              const isCurrent = w.mondayISO === weekMonday;
              return `
                <button
                  onclick="window.appActions.setWeekStart('${w.mondayISO}')"
                  class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 transition-all cursor-pointer ${isCurrent ? 'bg-[#001A57] text-[#FEBE10] shadow-xs ring-2 ring-[#001A57]/20' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}"
                >
                  Sem ${idx + 1}: ${formatShortDateES(w.mondayISO).slice(0, 6)} (${w.hours}h)
                </button>
              `;
            }).join('')}
          </div>

          <!-- Contenedor de la Rejilla Semanal estilo Google Calendar -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
            <div class="min-w-[1050px]">
              <!-- Cabecera de los 7 días de la semana -->
              <div class="grid grid-cols-[76px_repeat(7,minmax(0,1fr))] bg-[#001A57] text-white border-b border-slate-200">
                <div class="p-2.5 text-center text-xs font-bold text-slate-300 border-r border-white/10 flex items-center justify-center">
                  GMT+1/2
                </div>
                ${weekDays.map(d => {
                  const isToday = d.dateISO === '2026-10-17';
                  return `
                    <div class="p-2.5 text-center border-r border-white/10 ${isToday ? 'bg-[#E30613]/30' : ''}">
                      <div class="text-xs font-bold uppercase tracking-wider ${d.index >= 4 ? 'text-[#FEBE10]' : 'text-slate-300'}">
                        ${d.dayName}
                      </div>
                      <div class="text-base font-extrabold mt-0.5">
                        ${d.dayNumber} ${d.monthShort}
                      </div>
                      ${d.totalHours > 0 ? `
                        <div class="mt-1 inline-block px-2 py-0.5 rounded-full text-xs font-extrabold bg-white/15 text-[#FEBE10]">
                          ${d.totalHours}h lectivas
                        </div>
                      ` : `<div class="mt-1 text-xs text-slate-400">Sin clases</div>`}
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Franja superior para eventos sin hora asignada (ej. GET TOGETHER o pendientes) -->
              ${weekDays.some(d => d.untimedSessions.length > 0) ? `
                <div class="grid grid-cols-[76px_repeat(7,minmax(0,1fr))] bg-amber-50/50 border-b border-slate-200">
                  <div class="p-2 text-xs font-bold text-slate-500 border-r border-slate-200 flex items-center justify-center text-center">
                    Todo el día / Hora pend.
                  </div>
                  ${weekDays.map(d => `
                    <div class="p-1.5 border-r border-slate-200 space-y-1">
                      ${d.untimedSessions.map(s => {
                        const bCfg = BLOCKS_CONFIG[s.blockId] || BLOCKS_CONFIG.INSTITUCIONAL;
                        return `
                          <div
                            onclick="window.appActions.openSessionModal('${s.id}')"
                            class="p-2 rounded-xl border-l-4 shadow-xs cursor-pointer hover:shadow-md transition-all text-xs"
                            style="background-color: ${bCfg.bgLight}; border-color: ${bCfg.color};"
                          >
                            <div class="font-extrabold text-[#001A57]">${escapeHtml(s.displayTitle)}</div>
                            ${s.aula ? `<div class="text-slate-600">📍 ${escapeHtml(s.aula)}</div>` : ''}
                            <div class="mt-1">${renderSportswearBadge(s, true)}</div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  `).join('')}
                </div>
              ` : ''}

              <!-- Cuerpo de Rejilla Horaria Vertical (08:00 a 21:00) -->
              <div class="grid grid-cols-[76px_repeat(7,minmax(0,1fr))] relative" style="height: ${TOTAL_GRID_HEIGHT}px;">
                <!-- Columna de Horas -->
                <div class="border-r border-slate-200 bg-slate-50 relative select-none">
                  ${hoursTicks.slice(0, -1).map((h, i) => `
                    <div
                      class="border-b border-slate-200/80 pr-2 pt-1 text-right text-xs font-bold text-slate-500"
                      style="height: ${HOUR_HEIGHT_PX}px;"
                    >
                      ${String(h).padStart(2, '0')}:00
                    </div>
                  `).join('')}
                </div>

                <!-- 7 Columnas de Lunes a Domingo -->
                ${weekDays.map(d => {
                  const positioned = layoutDayTimedSessions(d.timedSessions);
                  return `
                    <div class="border-r border-slate-200 relative bg-white hover:bg-slate-50/30 transition-colors">
                      <!-- Líneas horizontales de cada hora -->
                      ${hoursTicks.slice(0, -1).map(() => `
                        <div class="border-b border-slate-100" style="height: ${HOUR_HEIGHT_PX}px;"></div>
                      `).join('')}

                      <!-- Bloques proporcionales de cada clase -->
                      ${positioned.map(({ session: s, col, totalCols }) => {
                        const startOffsetHours = Math.max(0, (s.startMinutes - START_HOUR * 60) / 60);
                        const durationH = Math.max(0.75, (s.endMinutes - s.startMinutes) / 60);
                        const topPx = Math.round(startOffsetHours * HOUR_HEIGHT_PX);
                        const heightPx = Math.max(54, Math.round(durationH * HOUR_HEIGHT_PX) - 3);
                        const widthPct = 100 / totalCols;
                        const leftPct = col * widthPct;

                        const bCfg = BLOCKS_CONFIG[s.blockId] || BLOCKS_CONFIG.INSTITUCIONAL;
                        const mCfg = MODULES_CONFIG[s.moduleId] || MODULES_CONFIG.EVENTO;

                        return `
                          <div
                            onclick="window.appActions.openSessionModal('${s.id}')"
                            style="
                              top: ${topPx}px;
                              height: ${heightPx}px;
                              left: calc(${leftPct}% + 3px);
                              width: calc(${widthPct}% - 6px);
                              background-color: ${bCfg.bgLight};
                              border-left: 4px solid ${bCfg.color};
                              border-top: 1px solid ${bCfg.border};
                              border-right: 1px solid ${bCfg.border};
                              border-bottom: 1px solid ${bCfg.border};
                            "
                            class="absolute rounded-xl p-2 shadow-sm hover:shadow-lg hover:z-20 transition-all cursor-pointer overflow-y-auto flex flex-col justify-between"

    function buildDonutSvg(segments, totalValue, centerTopText, centerSubText) {
      const size = 210;
      const stroke = 28;
      const radius = (size - stroke) / 2;
      const circumference = 2 * Math.PI * radius;
      let accumPct = 0;

      const circles = segments.filter(seg => seg.value > 0).map(seg => {
        const pct = totalValue > 0 ? seg.value / totalValue : 0;
        const dash = pct * circumference;
        const offset = -accumPct * circumference;
        accumPct += pct;
        return `
          <circle
            cx="${size / 2}"
            cy="${size / 2}"
            r="${radius}"
            fill="transparent"
            stroke="${seg.color}"
            stroke-width="${stroke}"
            stroke-dasharray="${dash} ${circumference}"
            stroke-dashoffset="${offset}"
            transform="rotate(-90 ${size / 2} ${size / 2})"
          >
            <title>${escapeHtml(seg.label)}: ${seg.value}h (${Math.round(pct * 1000) / 10}%)</title>
          </circle>
        `;
      }).join('');

      return `
        <div class="relative inline-flex items-center justify-center">
          <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
            <circle
              cx="${size / 2}"
              cy="${size / 2}"
              r="${radius}"
              fill="transparent"
              stroke="#E2E8F0"
              stroke-width="${stroke}"
            />
            ${circles}
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-4 pointer-events-none">
            <div class="text-2xl font-black text-[#001A57] leading-none">${escapeHtml(centerTopText)}</div>
            <div class="text-xs font-bold text-slate-500 mt-1">${escapeHtml(centerSubText)}</div>
          </div>
        </div>
      `;
    }

    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      const filteredCalendarSessions = getFilteredCalendarSessions();

      let mainContentHtml = '';
      if (state.activeMainTab === 'CALENDAR') {
        const viewHtml = state.calendarView === 'MONTH'
          ? renderMonthView(filteredCalendarSessions)
          : state.calendarView === 'WEEK'
            ? renderWeekView(filteredCalendarSessions)
            : renderAgendaView(filteredCalendarSessions);

        mainContentHtml = `
          ${renderCalendarToolbar(filteredCalendarSessions)}
          ${viewHtml}
        `;
      } else {
        mainContentHtml = renderStatisticsView();
      }

      root.innerHTML = `
        ${renderHeader()}
        <main class="flex-1 max-w-[1600px] w-full mx-auto px-4 py-5">
          ${mainContentHtml}
        </main>
        ${renderFooter()}
        ${renderOnboardingModal()}
        ${renderSessionDetailModal()}
        ${renderSportswearAlertModal()}
        ${renderUploadModal()}
      `;

      // Activar soporte Drag & Drop en el modal si está abierto
      const dz = document.getElementById('dropzone-area');
      if (dz) {
        dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('border-[#E30613]', 'bg-red-50/30'); });
        dz.addEventListener('dragleave', e => { e.preventDefault(); dz.classList.remove('border-[#E30613]', 'bg-red-50/30'); });
        dz.addEventListener('drop', e => {
          e.preventDefault();
          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
            handleManualFileUpload(e.dataTransfer.files[0]);
          }
        });
      }
    }

    // Exportación a CSV
    function downloadCsv(filename, rowsArray) {
      const csvContent = '\uFEFF' + rowsArray.map(r => r.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    window.appActions = {
      selectGroup(groupKey) {
        state.selectedGroup = groupKey;
        state.selectedSubgroup = 'ALL';
        state.showOnboardingModal = false;
        try {
          localStorage.setItem('uerm_master_selected_group', groupKey);
          localStorage.setItem('uerm_master_selected_subgroup', 'ALL');
        } catch (e) {}
        renderApp();
      },
      setSubgroup(sub) {
        state.selectedSubgroup = sub;
        try { localStorage.setItem('uerm_master_selected_subgroup', sub); } catch (e) {}
        renderApp();
      },
      openOnboarding() {
        state.showOnboardingModal = true;
        renderApp();
      },
      setMainTab(tab) {
        state.activeMainTab = tab;
        renderApp();
      },
      setCalendarView(view) {
        state.calendarView = view;
        renderApp();
      },
      goToToday() {
        state.currentYear = 2026;
        state.currentMonth = 9; // Octubre 2026
        state.currentWeekStartISO = '2026-10-12';
        renderApp();
      },
      navigateCalendar(delta) {
        if (state.calendarView === 'MONTH') {
          let m = state.currentMonth + delta;
          let y = state.currentYear;
          if (m < 0) { m = 11; y -= 1; }
          if (m > 11) { m = 0; y += 1; }
          state.currentMonth = m;
          state.currentYear = y;
        } else if (state.calendarView === 'WEEK') {
          state.currentWeekStartISO = addDaysISO(state.currentWeekStartISO, delta * 7);
          const [wy, wm] = state.currentWeekStartISO.split('-').map(Number);
          state.currentYear = wy;
          state.currentMonth = wm - 1;
        }
        renderApp();
      },
      jumpToMonth(year, monthIdx) {
        state.currentYear = year;
        state.currentMonth = monthIdx;
        state.calendarView = 'MONTH';
        renderApp();
      },

        state.currentWeekStartISO = mondayISO;

            s.excelRowNumber, s.sheetNameClean, s.diaSemanaExcel, s.dateISO,
            s.startTime || '', s.endTime || '', s.durationHours,
            s.moduleId, s.blockName, s.rawModulo || '', s.displayTitle,
            s.aula || '', s.profesores || '', s.requiresSportswear ? 'SÍ' : 'NO', s.comentarios || ''
          ]);
        }
        downloadCsv(`Calendario_Master_UERM_${getEffectiveGroupKey()}.csv`, rows);
      },
      exportStatsCSV() {
        const stats = computeMasterStatistics();
        if (state.statsTableTab === 'MONTHLY') {
          const rows = [['Mes', 'Horas Entrenamiento (M1-M3)', 'Horas Nutrición (M4-M6+ISAK)', 'Horas Prácticas (M7)', 'Horas TFG (M8)', 'Sesiones Ropa Deportiva', 'Total Sesiones', 'Total Horas']];
          for (const m of stats.monthlyData) {
            rows.push([m.label, m.byBlock.ENTRENAMIENTO, m.byBlock.NUTRICION, m.byBlock.PRACTICAS, m.byBlock.TFG, m.sportswearSessions, m.totalSessions, m.totalHours]);
          }
          downloadCsv(`Estadisticas_Mensuales_Master_UERM_${getEffectiveGroupKey()}.csv`, rows);
        } else if (state.statsTableTab === 'WEEKLY') {
          const rows = [['Semana', 'Fechas', 'Horas Entrenamiento', 'Horas Nutrición', 'Horas Prácticas', 'Horas TFG', 'Sesiones Ropa Deportiva', 'Total Sesiones', 'Total Horas']];
          for (const w of stats.weeklyData) {
            rows.push([`Semana ${w.weekNumber}`, w.rangeLabel, w.byBlock.ENTRENAMIENTO, w.byBlock.NUTRICION, w.byBlock.PRACTICAS, w.byBlock.TFG, w.sportswearSessions, w.totalSessions, w.totalHours]);
          }
          downloadCsv(`Estadisticas_Semanales_Master_UERM_${getEffectiveGroupKey()}.csv`, rows);
        } else {
          const rows = [['Profesor', 'Bloques', 'Módulos', 'Sesiones', 'Total Horas']];
          for (const p of stats.professorsData) {
            rows.push([p.name, [...p.blocks].join(', '), [...p.modules].join(', '), p.sessions, p.hours]);
          }
          downloadCsv(`Estadisticas_Profesorado_Master_UERM_${getEffectiveGroupKey()}.csv`, rows);
        }
      }
    };

    // Inicializar aplicación y configurar Auto-Polling cada 5 minutos (300 s)
    renderApp();
    syncWithSharePoint(false);

    setInterval(() => {
      if (state.nextSyncSeconds > 1) {
        state.nextSyncSeconds -= 1;
      } else {
        state.nextSyncSeconds = 300;
        syncWithSharePoint(false);
      }
    }, 1000);

    // Sincronizar también automáticamente cuando el usuario vuelve a la pestaña del navegador
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        syncWithSharePoint(false);
      }
    });
  </script>
</body>
</html>
