      const gKey = getEffectiveGroupKey();
      return `
        <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 ue-dark-glass text-white border-t border-white/15 px-2 py-1.5 shadow-2xl">
          <div class="grid grid-cols-5 gap-1 max-w-md mx-auto">
            <button
              onclick="window.appActions.switchMainView('CALENDAR', 'WEEK')"
              class="py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-bold cursor-pointer ${state.activeMainTab === 'CALENDAR' && state.calendarView === 'WEEK' ? 'bg-[#E30613] text-white' : 'text-slate-300'}"
            >
              ${ICONS.clock}
              <span>Semana</span>
            </button>
            <button
              onclick="window.appActions.switchMainView('CALENDAR', 'MONTH')"
              class="py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-bold cursor-pointer ${state.activeMainTab === 'CALENDAR' && state.calendarView === 'MONTH' ? 'bg-[#E30613] text-white' : 'text-slate-300'}"
            >
              ${ICONS.calendar}
              <span>Mes</span>
            </button>
            <button
              onclick="window.appActions.switchMainView('CALENDAR', 'AGENDA')"
              class="py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-bold cursor-pointer ${state.activeMainTab === 'CALENDAR' && state.calendarView === 'AGENDA' ? 'bg-[#E30613] text-white' : 'text-slate-300'}"
            >
              ${ICONS.list}
              <span>Agenda</span>
            </button>
            <button
              onclick="window.appActions.setMainTab('STATS')"
              class="py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-bold cursor-pointer ${state.activeMainTab === 'STATS' ? 'bg-[#FEBE10] text-[#060E1E]' : 'text-slate-300'}"
            >
              ${ICONS.chart}
              <span>Horas</span>
            </button>
            <button
              onclick="window.appActions.openOnboardingDialog()"
              class="py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-bold cursor-pointer text-[#FEBE10] bg-white/10"
            >
              ${ICONS.users}
              <span>${gKey === 'M11_M12' ? 'M11/12' : 'M13/14'}</span>
            </button>
          </div>
        </nav>
      `;
    }

    function openDialogWithHtml(innerHtml) {
      const dlg = document.getElementById('app-modal-dialog');
      if (!dlg) return;
      dlg.innerHTML = innerHtml;
      if (!dlg.open && typeof dlg.showModal === 'function') {
        dlg.showModal();
      }
    }

    function closeDialogModal() {
      const dlg = document.getElementById('app-modal-dialog');
      if (dlg && dlg.open && typeof dlg.close === 'function') {
        dlg.close();
      }
      state.activeDialogType = null;
      state.selectedSessionId = null;
      state.sportswearAlertSession = null;
    }

    function showOnboardingModalNative() {
      const all = state.parsedData.sessions || [];
      const m11 = all.filter(s => s.groupKey === 'M11_M12');
      const m13 = all.filter(s => s.groupKey === 'M13_M14');
      const m11H = Math.round(m11.reduce((a, b) => a + b.durationHours, 0));
      const m13H = Math.round(m13.reduce((a, b) => a + b.durationHours, 0));
      const gKey = getEffectiveGroupKey();

      openDialogWithHtml(`
        <div class="bg-white rounded-3xl overflow-hidden shadow-2xl border border-slate-200 max-h-[90dvh] overflow-y-auto mx-2 sm:mx-0">
          <div class="ue-dark-glass text-white p-5 sm:p-7">
            <div class="flex items-center justify-between gap-3 mb-3">
              <div class="bg-white rounded-xl p-1.5">
                <img src="${LOGO_DATA_URI}" alt="Escuela Universitaria Real Madrid" class="h-9 w-auto object-contain" />
              </div>
              <button onclick="window.appActions.closeModal()" class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 text-white font-bold text-sm cursor-pointer">✕</button>
            </div>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-[#FEBE10] text-[#060E1E]">SELECCIÓN DE GRUPO ACADÉMICO</span>
            <h3 class="text-xl sm:text-2xl font-extrabold mt-2">¿A qué grupo perteneces?</h3>
            <p class="text-xs text-slate-300 mt-1">El calendario abrirá directamente en la semana actual filtrando tus aulas, profesores y fechas del Curso ISAK.</p>
          </div>

          <div class="p-5 sm:p-7 space-y-4 bg-[#F4F6FA]">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <button
                onclick="window.appActions.selectGroup('M11_M12')"
                class="text-left bg-white hover:bg-red-50/30 rounded-2xl p-5 border-2 ${gKey === 'M11_M12' ? 'border-[#E30613]' : 'border-slate-200'} shadow-sm transition-all cursor-pointer"
              >
                <div class="flex items-center justify-between mb-2">
                  <span class="px-2 py-0.5 rounded bg-[#E30613] text-white text-xs font-extrabold">OPCIÓN A</span>
                  <span class="font-mono-tech text-xs font-bold text-slate-500">${m11.length} ses. · ${m11H}h</span>
                </div>
                <div class="text-lg font-extrabold text-[#060E1E]">Eres del grupo M11 / M12</div>
                <div class="text-xs text-slate-500 mt-2 space-y-1">
                  <div>Aula principal: <strong>P206 + Laboratorios</strong></div>
                  <div>Curso ISAK: <strong>13, 14 y 15 Nov</strong></div>
                </div>
              </button>

              <button
                onclick="window.appActions.selectGroup('M13_M14')"
                class="text-left bg-white hover:bg-blue-50/30 rounded-2xl p-5 border-2 ${gKey === 'M13_M14' ? 'border-[#001A57]' : 'border-slate-200'} shadow-sm transition-all cursor-pointer"
              >
                <div class="flex items-center justify-between mb-2">
                  <span class="px-2 py-0.5 rounded bg-[#001A57] text-[#FEBE10] text-xs font-extrabold">OPCIÓN B</span>
                  <span class="font-mono-tech text-xs font-bold text-slate-500">${m13.length} ses. · ${m13H}h</span>
                </div>
                <div class="text-lg font-extrabold text-[#060E1E]">Eres del grupo M13 / M14</div>
                <div class="text-xs text-slate-500 mt-2 space-y-1">
                  <div>Aulas principales: <strong>B308 y C232 + Labs</strong></div>
                  <div>Curso ISAK: <strong>3, 4 y 5 Nov</strong></div>
                </div>
              </button>
            </div>
          </div>
        </div>
      `);
    }

    function showSessionDetailModalNative(sessionId) {
      const all = state.parsedData.sessions || [];
      const s = all.find(it => it.id === sessionId);
      if (!s) return;
      const bCfg = BLOCKS_CONFIG[s.blockId] || BLOCKS_CONFIG.INSTITUCIONAL;
      const footerNote = state.parsedData.footers[s.groupKey] || 'SUJETO A CAMBIOS';

      openDialogWithHtml(`
        <div class="bg-white rounded-3xl overflow-hidden shadow-2xl border border-slate-200 max-h-[90dvh] overflow-y-auto mx-2 sm:mx-0">
          <div class="p-5 sm:p-6 text-white" style="background: ${bCfg.accentGrad};">
            <div class="flex items-start justify-between gap-3">
              <div>
                <div class="flex flex-wrap items-center gap-1.5 mb-2">
                  <span class="px-2.5 py-0.5 rounded-lg text-xs font-extrabold bg-white text-[#060E1E]">${escapeHtml(s.moduleLabel)}</span>
                  <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold bg-black/25 text-white">${escapeHtml(bCfg.name)}</span>
                  <span class="px-2.5 py-0.5 rounded-lg text-xs font-mono-tech font-bold bg-[#FEBE10] text-[#060E1E]">Hoja ${escapeHtml(s.sheetNameClean)} · Fila #${s.excelRowNumber}</span>
                </div>
                <h3 class="text-lg sm:text-xl font-extrabold leading-snug">${escapeHtml(s.displayTitle)}</h3>
              </div>
              <button onclick="window.appActions.closeModal()" class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/30 text-white font-bold text-sm shrink-0 cursor-pointer">✕</button>
            </div>
          </div>

          <div class="p-5 sm:p-6 space-y-4 text-xs">
            ${s.requiresSportswear ? `
              <div class="p-3.5 rounded-2xl bg-[#FFFBEB] border-2 border-[#FEBE10] flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-[#FEBE10] text-[#060E1E] flex items-center justify-center shrink-0">${ICONS.shirt}</div>
                <div>
                  <div class="font-extrabold text-[#92400E] text-sm">⚠️ Hay que asistir con ropa deportiva a esta clase</div>
                  <div class="text-amber-900">Indicación en Excel: <strong>${escapeHtml(s.rawClothingNote)}</strong></div>
                </div>
              </div>
            ` : ''}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80">
                <div class="font-bold text-slate-400 uppercase mb-1">Fecha</div>
                <div class="text-sm font-extrabold text-[#060E1E]">${escapeHtml(formatFullDateES(s.dateISO))}</div>
              </div>
              <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80">
                <div class="font-bold text-slate-400 uppercase mb-1">Horario y Duración</div>
                <div class="text-sm font-extrabold font-mono-tech text-[#060E1E]">${s.startTime && s.endTime ? `${s.startTime} – ${s.endTime}` : 'Por confirmar'} (${s.durationHours}h)</div>
              </div>
              <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80">
                <div class="font-bold text-slate-400 uppercase mb-1">Aula / Instalación</div>
                <div class="text-sm font-extrabold text-[#060E1E]">${escapeHtml(s.aula || 'Por confirmar')}</div>
              </div>
              <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80">
                <div class="font-bold text-slate-400 uppercase mb-1">Profesorado</div>
                <div class="text-sm font-extrabold text-[#060E1E]">${escapeHtml(s.profesores || 'Por confirmar')}</div>
              </div>
            </div>

            <!-- Tabla íntegra de celdas de la fila en el Excel -->
            <div class="rounded-2xl border border-slate-200 overflow-hidden">
              <div class="ue-dark-glass text-white px-4 py-2 font-extrabold flex items-center justify-between">
                <span>Registro Íntegro de Celdas en Excel</span>
                <span class="text-[#FEBE10] font-mono-tech">Fila #${s.excelRowNumber}</span>
              </div>
              <div class="divide-y divide-slate-200">
                ${s.allRowColumns.map(col => `
                  <div class="grid grid-cols-3 px-4 py-2 bg-white">
                    <div class="font-bold text-slate-500">${escapeHtml(col.header)}</div>
                    <div class="col-span-2 font-semibold text-[#060E1E]">${col.value !== null ? escapeHtml(col.value) : '<span class="text-slate-400 italic">Vacío</span>'}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="pt-2 flex items-center justify-between">
              <span class="text-slate-400 font-bold">${escapeHtml(footerNote)}</span>
              <button onclick="window.appActions.closeModal()" class="px-4 py-2 rounded-xl bg-[#060E1E] text-white font-extrabold cursor-pointer">Cerrar</button>
            </div>
          </div>
        </div>
      `);
    }

    function showSportswearModalNative(sessionId) {
      const s = (state.parsedData.sessions || []).find(it => it.id === sessionId);
      if (!s) return;
      openDialogWithHtml(`
        <div class="bg-white rounded-3xl p-6 shadow-2xl border-2 border-[#FEBE10] max-w-md mx-auto">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-11 h-11 rounded-2xl bg-[#FEBE10] text-[#060E1E] flex items-center justify-center">${ICONS.shirt}</div>
            <div>
              <div class="text-xs font-extrabold uppercase text-[#D97706]">Equipación Obligatoria</div>
              <h3 class="text-base font-extrabold text-[#060E1E]">⚠️ Hay que asistir con ropa deportiva a esta clase</h3>
            </div>
          </div>
          <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs space-y-1.5 mb-4">
            <div><strong>Sesión:</strong> ${escapeHtml(s.displayTitle)}</div>
            <div><strong>Fecha:</strong> ${escapeHtml(formatFullDateES(s.dateISO))} (${escapeHtml(s.startTime || '')}–${escapeHtml(s.endTime || '')})</div>
            <div><strong>Espacio:</strong> ${escapeHtml(s.aula || '—')}</div>
            <div><strong>Nota Excel:</strong> <span class="font-bold text-[#92400E]">${escapeHtml(s.rawClothingNote)}</span></div>
          </div>
          <div class="flex justify-end gap-2">
            <button onclick="window.appActions.openSessionModal('${s.id}')" class="px-3.5 py-2 rounded-xl bg-slate-100 text-[#060E1E] text-xs font-bold cursor-pointer">Ver ficha completa</button>
            <button onclick="window.appActions.closeModal()" class="px-4 py-2 rounded-xl bg-[#060E1E] text-[#FEBE10] text-xs font-extrabold cursor-pointer">Entendido</button>
          </div>
        </div>
      `);
    }

    function showUploadModalNative() {
      openDialogWithHtml(`
        <div class="bg-white rounded-3xl p-6 shadow-2xl border border-slate-200 max-w-md mx-auto">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-base font-extrabold text-[#060E1E]">Actualizar archivo Excel (.xlsx)</h3>
            <button onclick="window.appActions.closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-700 font-bold text-xs cursor-pointer">✕</button>
          </div>
          <p class="text-xs text-slate-500 mb-4">La aplicación lee automáticamente el Excel en vivo desde SharePoint. También puedes seleccionar manualmente un archivo <code>.xlsx</code>:</p>
          <label class="border-2 border-dashed border-slate-300 hover:border-[#E30613] rounded-2xl p-6 flex flex-col items-center justify-center text-center cursor-pointer bg-slate-50">
            <span class="text-xs font-extrabold text-[#060E1E]">Seleccionar archivo .xlsx</span>
            <input type="file" accept=".xlsx,.xls" class="hidden" onchange="if(this.files && this.files[0]) window.appActions.handleFileSelect(this.files[0])" />
          </label>
        </div>
      `);
    }

    // Cerrar <dialog> al hacer clic en el backdrop
    const dlgEl = document.getElementById('app-modal-dialog');
    if (dlgEl) {
      dlgEl.addEventListener('click', e => {
        if (e.target === dlgEl) closeDialogModal();
      });
    }

    // ============================================================================
    // 11. RENDERIZADO PRINCIPAL Y ACCIONES
    // ============================================================================
    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;
      const filteredSessions = getFilteredCalendarSessions();

      let mainHtml = '';
      if (state.activeMainTab === 'CALENDAR') {
        const viewHtml = state.calendarView === 'WEEK'
          ? renderWeekView(filteredSessions)
          : state.calendarView === 'MONTH'
            ? renderMonthView(filteredSessions)
            : renderAgendaView(filteredSessions);

        mainHtml = `
          ${renderQuickGuideBanner()}
          ${renderCalendarControlDeck(filteredSessions)}
          ${viewHtml}
        `;
      } else {
        mainHtml = renderStatisticsView();
      }

      root.innerHTML = `
        ${renderHeader()}
        <main class="flex-1 max-w-[1560px] w-full mx-auto px-3 sm:px-6 py-4">
          ${mainHtml}
        </main>
        ${renderMobileBottomDock()}
      `;
    }

    function downloadCsv(filename, rowsArray) {
      const csvContent = '\uFEFF' + rowsArray.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    window.appActions = {
      selectGroup(groupKey) {
        state.selectedGroup = groupKey;
        state.selectedSubgroup = 'ALL';
        try {
          localStorage.setItem('uerm_master_selected_group', groupKey);
          localStorage.setItem('uerm_master_selected_subgroup', 'ALL');
        } catch (e) {}
        closeDialogModal();
        renderApp();
      },
      openOnboardingDialog() { showOnboardingModalNative(); },
      openSessionModal(id) { showSessionDetailModalNative(id); },
      openSportswearAlert(id) { showSportswearModalNative(id); },
      openUploadDialog() { showUploadModalNative(); },
      closeModal() { closeDialogModal(); },
      toggleQuickGuide() {
        state.showQuickGuide = !state.showQuickGuide;
        renderApp();
      },
      dismissQuickGuide() {
        state.showQuickGuide = false;
        try { localStorage.setItem('uerm_hide_quick_guide', '1'); } catch (e) {}
        renderApp();
      },
      switchMainView(mainTab, calView) {
        state.activeMainTab = mainTab;
        if (calView) state.calendarView = calView;
        renderApp();
      },
      setMainTab(tab) {
        state.activeMainTab = tab;
        renderApp();
      },
      setCalendarView(view) {
        state.calendarView = view;
        renderApp();
      },
      setWeekSubMode(mode) {
        state.weekSubMode = mode;
        renderApp();
      },
      setDayFilterInWeek(dayISO) {
        state.selectedDayFilterInWeek = dayISO;
        renderApp();
      },
      selectMonthDayMobile(dateISO) {
        state.selectedDayInMonthMobile = dateISO;
        renderApp();
      },
      goToToday() {
        const curMon = getInitialAcademicWeekMonday(state.parsedData);
        const [wy, wm] = curMon.split('-').map(Number);
        state.currentWeekStartISO = curMon;
        state.currentYear = wy;
        state.currentMonth = wm - 1;
        state.selectedDayFilterInWeek = 'ALL';
        state.calendarView = 'WEEK';
        state.activeMainTab = 'CALENDAR';
        renderApp();
      },
      resetFiltersAndGoToCurrentWeek() {
        state.calendarBlockFilter = 'ALL';
        state.calendarModuleFilter = 'ALL';
        state.onlySportswearFilter = false;
        state.searchQuery = '';
        this.goToToday();
      },
      navigateCalendar(delta) {
        if (state.calendarView === 'WEEK') {
          state.currentWeekStartISO = addDaysISO(state.currentWeekStartISO, delta * 7);
          state.selectedDayFilterInWeek = 'ALL';
          const [wy, wm] = state.currentWeekStartISO.split('-').map(Number);
          state.currentYear = wy;
          state.currentMonth = wm - 1;
        } else {
          let m = state.currentMonth + delta;
          let y = state.currentYear;
          if (m < 0) { m = 11; y -= 1; }
          if (m > 11) { m = 0; y += 1; }
          state.currentMonth = m;
          state.currentYear = y;
        }
        renderApp();
      },
      jumpToMonth(year, monthIdx) {
        state.currentYear = year;
        state.currentMonth = monthIdx;
        // Si está en vista Semana, saltar a la primera semana lectiva de ese mes
        const ymPrefix = `${year}-${String(monthIdx + 1).padStart(2, '0')}`;
        const firstSessionInMonth = getSessionsForSelectedGroup().find(s => s.dateISO.startsWith(ymPrefix));
        if (firstSessionInMonth) {
          state.currentWeekStartISO = getMondayOfDateISO(firstSessionInMonth.dateISO);
          state.selectedDayInMonthMobile = firstSessionInMonth.dateISO;
        }
        state.selectedDayFilterInWeek = 'ALL';
        renderApp();
      },
      setWeekStart(mondayISO) {
        state.currentWeekStartISO = mondayISO;
        state.selectedDayFilterInWeek = 'ALL';
        const [wy, wm] = mondayISO.split('-').map(Number);
        state.currentYear = wy;
        state.currentMonth = wm - 1;
        renderApp();
      },
      openWeekFromStats(mondayISO) {
        state.currentWeekStartISO = mondayISO;
        state.selectedDayFilterInWeek = 'ALL';
        state.activeMainTab = 'CALENDAR';
        state.calendarView = 'WEEK';
        renderApp();
      },
      setSearchQuery(q) {
        state.searchQuery = q;
        renderApp();
      },
      setCalendarBlockFilter(blockId) {
        state.calendarBlockFilter = state.calendarBlockFilter === blockId ? 'ALL' : blockId;
        state.calendarModuleFilter = 'ALL';
        renderApp();
      },
      setCalendarModuleFilter(modId) {
        state.calendarModuleFilter = state.calendarModuleFilter === modId ? 'ALL' : modId;
        renderApp();
      },
      toggleOnlySportswear() {
        state.onlySportswearFilter = !state.onlySportswearFilter;
        state.activeMainTab = 'CALENDAR';
        renderApp();
      },
      handleFileSelect(file) { handleManualFileUpload(file); },
      syncNow() { syncWithSharePoint(true); },
      setStatsBlockMode(mode) { state.statsBlockMode = mode; state.statsModuleFilter = 'ALL'; renderApp(); },
      setStatsModuleFilter(modId) { state.statsModuleFilter = state.statsModuleFilter === modId ? 'ALL' : modId; renderApp(); },
      toggleStatsIsak(c) { state.statsIncludeIsakInNutricion = Boolean(c); renderApp(); },
      toggleStatsInstitutional(c) { state.statsIncludeInstitutional = Boolean(c); renderApp(); },
      setStatsMonthChartMode(m) { state.statsMonthChartMode = m; renderApp(); },
      exportSessionsCSV() {
        const sessions = getFilteredCalendarSessions();
        const rows = [['Fila Excel', 'Grupo', 'Día', 'Fecha', 'Inicio', 'Fin', 'Horas', 'Módulo', 'Bloque', 'Sesión', 'Aula', 'Profesores', 'Ropa Deportiva', 'Comentarios']];
        for (const s of sessions) {
          rows.push([s.excelRowNumber, s.sheetNameClean, s.diaSemanaExcel, s.dateISO, s.startTime || '', s.endTime || '', s.durationHours, s.moduleId, s.blockName, s.displayTitle, s.aula || '', s.profesores || '', s.requiresSportswear ? 'SÍ' : 'NO', s.comentarios || '']);
        }
        downloadCsv(`Calendario_Master_UERM_${getEffectiveGroupKey()}.csv`, rows);
      }
    };

    // Inicializar directamente en la Semana Actual y abrir selector de grupo si es primera visita
    renderApp();
    if (state.showOnboardingModal) {
      showOnboardingModalNative();
    }
    syncWithSharePoint(false);

    setInterval(() => {
      if (state.nextSyncSeconds > 1) {
        state.nextSyncSeconds -= 1;
      } else {
        state.nextSyncSeconds = 300;
        syncWithSharePoint(false);
      }
    }, 1000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncWithSharePoint(false);
    });
  </script>
</body>
</html>
