  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(15, 37, 55, 0.04); }
    ::-webkit-scrollbar-thumb { background: rgba(15, 37, 55, 0.22); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(15, 37, 55, 0.4); }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }
    .animate-pulse-dot { animation: pulse-dot 2s infinite ease-in-out; }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-sync { animation: spin-slow 1s linear infinite; }

    /* Tooltip for Ropa Deportiva */
    .sportswear-badge-wrap { position: relative; display: inline-flex; }
    .sportswear-tooltip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: #001A57;
      color: #FFFFFF;
      border: 1.5px solid #FEBE10;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      z-index: 90;
      box-shadow: 0 10px 25px -5px rgba(0, 26, 87, 0.5);
      transition: all 0.16s ease;
      pointer-events: none;
    }
    .sportswear-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #FEBE10 transparent transparent transparent;
    }
    .sportswear-badge-wrap:hover .sportswear-tooltip,
    .sportswear-badge-wrap:focus-within .sportswear-tooltip {
      visibility: visible;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>

        }
      }
      if (eocdOffset === -1) throw new Error('El archivo no es un contenedor ZIP/XLSX válido');

      const totalEntries = view.getUint16(eocdOffset + 10, true);
      const cdOffset = view.getUint32(eocdOffset + 16, true);
      const entries = {};
      let ptr = cdOffset;
      const decoder = new TextDecoder('utf-8');

      for (let i = 0; i < totalEntries; i++) {
        if (view.getUint32(ptr, true) !== 0x02014b50) break;
        const method = view.getUint16(ptr + 10, true);
        const compSize = view.getUint32(ptr + 20, true);
        const uncompSize = view.getUint32(ptr + 24, true);
        const nameLen = view.getUint16(ptr + 28, true);
        const extraLen = view.getUint16(ptr + 30, true);
        const commentLen = view.getUint16(ptr + 32, true);
        const localHeaderOffset = view.getUint32(ptr + 42, true);
        const name = decoder.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
        entries[name] = { method, compSize, uncompSize, localHeaderOffset };
        ptr += 46 + nameLen + extraLen + commentLen;
      }

      async function extractText(entryName) {
        const info = entries[entryName];
        if (!info) return null;
        const lh = info.localHeaderOffset;
        const fnameLen = view.getUint16(lh + 26, true);
        const extraLen = view.getUint16(lh + 28, true);
        const dataStart = lh + 30 + fnameLen + extraLen;
        const rawSlice = bytes.subarray(dataStart, dataStart + info.compSize);
        if (info.method === 0) return decoder.decode(rawSlice);
        const ds = new DecompressionStream('deflate-raw');
        const writer = ds.writable.getWriter();
        writer.write(rawSlice);
        writer.close();
        const outBuf = await new Response(ds.readable).arrayBuffer();
        return decoder.decode(outBuf);
      }

      function decodeXmlEntities(str) {
        if (!str) return '';
        return str
          .replace(/&#x([0-9a-fA-F]+);/g, (_, hex) => String.fromCodePoint(parseInt(hex, 16)))
          .replace(/&#(\d+);/g, (_, dec) => String.fromCodePoint(parseInt(dec, 10)))
          .replace(/&quot;/g, '"')
          .replace(/&apos;/g, "'")
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&amp;/g, '&');
      }

      const sharedStrings = [];
      const sstXml = await extractText('xl/sharedStrings.xml');
      if (sstXml) {
        const siMatches = sstXml.match(/<si[\s>][\s\S]*?<\/si>/g) || [];
        for (const si of siMatches) {
          const cleaned = si.replace(/<rPh[\s>][\s\S]*?<\/rPh>/g, '');
          const tMatches = [...cleaned.matchAll(/<t(?:\s+[^>]*)?>([\s\S]*?)<\/t>/g)];
          sharedStrings.push(tMatches.map(m => decodeXmlEntities(m[1])).join(''));
        }
      }

      const wbXml = await extractText('xl/workbook.xml');
      const relsXml = await extractText('xl/_rels/workbook.xml.rels');
      const relMap = {};
      if (relsXml) {
        for (const m of relsXml.matchAll(/<Relationship\s+[^>]*?Id="([^"]+)"[^>]*?Target="([^"]+)"/g)) {
          relMap[m[1]] = m[2].replace(/^\//, '').replace(/^(?!xl\/)/, 'xl/');
        }
        for (const m of relsXml.matchAll(/<Relationship\s+[^>]*?Target="([^"]+)"[^>]*?Id="([^"]+)"/g)) {
          relMap[m[2]] = m[1].replace(/^\//, '').replace(/^(?!xl\/)/, 'xl/');
        }
      }

      const sheetsList = [];
      if (wbXml) {
        for (const m of wbXml.matchAll(/<sheet\s+[^>]*?name="([^"]+)"[^>]*?r:id="([^"]+)"/g)) {
          sheetsList.push({ name: decodeXmlEntities(m[1]), rId: m[2] });
        }
      }

      function colToIdx(colStr) {
        let n = 0;
        for (let i = 0; i < colStr.length; i++) n = n * 26 + (colStr.charCodeAt(i) - 64);
        return n - 1;
      }

      function parseRef(ref) {
        const m = /^([A-Z]+)(\d+)$/.exec(ref);
        if (!m) return { r: 0, c: 0 };
        return { c: colToIdx(m[1]), r: parseInt(m[2], 10) - 1 };
      }

      function excelSerialToDateOrTime(num) {
        if (!Number.isFinite(num)) return String(num);
        if (num >= 0 && num < 1.0) {
          const totalMins = Math.round(num * 24 * 60);
          const hh = String(Math.floor(totalMins / 60) % 24).padStart(2, '0');
          const mm = String(totalMins % 60).padStart(2, '0');
          return `${hh}:${mm}`;
        }
        if (num > 36000 && num < 75000) {
          const utcMs = Math.round((num - 25569) * 86400 * 1000);
          return new Date(utcMs).toISOString().slice(0, 10);
        }
        return String(num);
      }

      const result = {};
      for (let idx = 0; idx < sheetsList.length; idx++) {
        const s = sheetsList[idx];
        const targetPath = relMap[s.rId] || `xl/worksheets/sheet${idx + 1}.xml`;
        const sheetXml = await extractText(targetPath);
        if (!sheetXml) continue;

        const merges = [];
        for (const mm of sheetXml.matchAll(/<mergeCell\s+ref="([A-Z]+\d+):([A-Z]+\d+)"/g)) {
          merges.push({ s: parseRef(mm[1]), e: parseRef(mm[2]) });
        }

        const rowsMap = new Map();
        let maxRow = 0;
        for (const rm of sheetXml.matchAll(/<row\s+[^>]*?r="(\d+)"[^>]*?>([\s\S]*?)<\/row>/g)) {
          const rIdx = parseInt(rm[1], 10) - 1;
          if (rIdx + 1 > maxRow) maxRow = rIdx + 1;
          const rowBody = rm[2];
          const cells = [];
          for (const cm of rowBody.matchAll(/<c\s+([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
            const attrs = cm[1];
            const inner = cm[2] || '';
            const refM = /\br="([A-Z]+\d+)"/.exec(attrs);
            if (!refM) continue;
            const { c: cIdx } = parseRef(refM[1]);
            const typeM = /\bt="([^"]+)"/.exec(attrs);
            const cType = typeM ? typeM[1] : 'n';

            let val = null;
            if (cType === 's') {
              const vM = /<v>([\s\S]*?)<\/v>/.exec(inner);
              if (vM) {
                const sstIdx = parseInt(vM[1], 10);
                val = sharedStrings[sstIdx] !== undefined ? sharedStrings[sstIdx] : vM[1];
              }
            } else if (cType === 'inlineStr' || cType === 'str') {
              const tMatches = [...inner.matchAll(/<t(?:\s+[^>]*)?>([\s\S]*?)<\/t>/g)];
              val = tMatches.map(m => decodeXmlEntities(m[1])).join('');
            } else {
              const vM = /<v>([\s\S]*?)<\/v>/.exec(inner);
              if (vM) {
                const num = parseFloat(vM[1]);
                val = Number.isNaN(num) ? decodeXmlEntities(vM[1]) : excelSerialToDateOrTime(num);
              }
            }
            cells[cIdx] = val;
          }
          const cleanRow = [];
          for (let c = 0; c < cells.length; c++) {
            cleanRow.push(cells[c] !== undefined ? cells[c] : null);
          }
          while (cleanRow.length > 0 && cleanRow[cleanRow.length - 1] === null) cleanRow.pop();
          rowsMap.set(rIdx, cleanRow);
        }

        const rows = [];
        for (let r = 0; r < maxRow; r++) rows.push(rowsMap.get(r) || []);
        result[s.name] = { rows, merges };
      }
      return result;
    }

    // Wrapper universal: usa nuestro parser nativo ZIP/XML (y valida con SheetJS si está disponible)
    async function parseExcelArrayBuffer(arrayBuffer) {
      try {
        return await parseXlsxBinaryNative(arrayBuffer);
      } catch (nativeErr) {
        if (window.XLSX) {
          const wb = window.XLSX.read(arrayBuffer, { type: 'array', cellDates: false });
          const out = {};
          for (const name of wb.SheetNames) {
            const ws = wb.Sheets[name];
            const rawRows = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
            const formattedRows = rawRows.map(r => r.map(v => {
              if (typeof v === 'number') {
                if (v >= 0 && v < 1) {
                  const mins = Math.round(v * 24 * 60);
                  return `${String(Math.floor(mins / 60) % 24).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
                }
                if (v > 36000 && v < 75000) {
                  return new Date(Math.round((v - 25569) * 86400 * 1000)).toISOString().slice(0, 10);
                }
              }
              return v !== null && v !== undefined ? String(v) : null;
            }));
            out[name] = { rows: formattedRows, merges: ws['!merges'] || [] };
          }
          return out;
        }
        throw nativeErr;
      }
    }

    // ============================================================================
    // 3. PROCESADOR INTEGRAL DE DATOS DEL EXCEL (0% PÉRDIDA DE INFORMACIÓN)
    // ============================================================================
    function normalizeText(str) {
      return String(str || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase()
        .trim();
    }

    function parseTimeMinutes(timeStr) {
      if (!timeStr) return null;
      const m = /^(\d{1,2}):(\d{2})/.exec(String(timeStr).trim());
      if (!m) return null;
      return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    }

    function classifyModuleAndBlock(rawModulo, rawSesion, rawComentarios, rawInicio, rawFin) {
      const modNorm = normalizeText(rawModulo);
      const sesNorm = normalizeText(rawSesion);
      const combined = `${modNorm} ${sesNorm}`;

      // Detectar Módulo 1 al 8 explícitamente
      const modMatch = /\b(?:MODULO|MOD|M)\s*([1-8])\b/.exec(combined);
      if (modMatch) {
        const num = parseInt(modMatch[1], 10);
        const modId = `M${num}`;
        const cfg = MODULES_CONFIG[modId];
        return {
          moduleId: modId,
          moduleNumber: num,
          moduleLabel: cfg.label,
          moduleFullLabel: cfg.fullLabel,
          blockId: cfg.block,
          blockName: BLOCKS_CONFIG[cfg.block].name,
          isOfficialModule: true,
          isIsak: false,
          isPendingSlot: !rawSesion
        };
      }

      // Curso ISAK (Cineantropometría -> área de Nutrición)
      if (combined.includes('ISAK') || combined.includes('CINEANTROPOMETRIA')) {
        return {
          moduleId: 'ISAK',
          moduleNumber: 4,
          moduleLabel: 'Curso ISAK',
          moduleFullLabel: MODULES_CONFIG.ISAK.fullLabel,
          blockId: 'NUTRICION',
          blockName: BLOCKS_CONFIG.NUTRICION.name,
          isOfficialModule: false,
          isIsak: true,
          isPendingSlot: false
        };
      }

      // Eventos / Actos de Bienvenida / Get Together
      if (
        modNorm.includes('BIENVENIDA') ||
        modNorm.includes('EVENTO') ||
        modNorm.includes('ACTO') ||
        sesNorm.includes('GET TOGETHER') ||
        sesNorm.includes('BIENVENIDA')
      ) {
        return {
          moduleId: 'EVENTO',
          moduleNumber: 9,
          moduleLabel: rawModulo ? String(rawModulo).trim() : 'Evento',
          moduleFullLabel: MODULES_CONFIG.EVENTO.fullLabel,
          blockId: 'INSTITUCIONAL',
          blockName: BLOCKS_CONFIG.INSTITUCIONAL.name,
          isOfficialModule: false,
          isIsak: false,
          isPendingSlot: false
        };
      }

      // Clasificación inteligente por palabras clave si algún día se añade una sesión sin número de módulo
      if (
        sesNorm.includes('NUTRICION') ||
        sesNorm.includes('DIETETICA') ||
        sesNorm.includes('ALIMENTO') ||
        sesNorm.includes('SUPLEMENTACION') ||
        sesNorm.includes('HIDRATACION') ||
        sesNorm.includes('INDYA') ||
        sesNorm.includes('INTESTINAL') ||
        sesNorm.includes('MICRONUTRIENTE')
      ) {
        return {
          moduleId: 'M4',
          moduleNumber: 4,
          moduleLabel: 'Módulo 4',
          moduleFullLabel: MODULES_CONFIG.M4.fullLabel,
          blockId: 'NUTRICION',
          blockName: BLOCKS_CONFIG.NUTRICION.name,
          isOfficialModule: true,
          isIsak: false,
          isPendingSlot: false
        };
      }

      if (sesNorm.includes('SIMULACION') || sesNorm.includes('PRACTICA') || sesNorm.includes('HOSPITAL')) {
        return {
          moduleId: 'M7',
          moduleNumber: 7,
          moduleLabel: 'Módulo 7',
          moduleFullLabel: MODULES_CONFIG.M7.fullLabel,
          blockId: 'PRACTICAS',
          blockName: BLOCKS_CONFIG.PRACTICAS.name,
          isOfficialModule: true,
          isIsak: false,
          isPendingSlot: false
        };
      }

      if (sesNorm.includes('TFM') || sesNorm.includes('TFG') || sesNorm.includes('FIN DE MASTER') || sesNorm.includes('METODOLOGIA') || sesNorm.includes('BIBLIOTECA')) {
        return {
          moduleId: 'M8',
          moduleNumber: 8,
          moduleLabel: 'Módulo 8',
          moduleFullLabel: MODULES_CONFIG.M8.fullLabel,
          blockId: 'TFG',
          blockName: BLOCKS_CONFIG.TFG.name,
          isOfficialModule: true,
          isIsak: false,
          isPendingSlot: false
        };
      }

      if (
        sesNorm.includes('FISIOLOGIA') ||
        sesNorm.includes('ENTRENAMIENTO') ||
        sesNorm.includes('FUERZA') ||
        sesNorm.includes('VELOCIDAD') ||
        sesNorm.includes('RESISTENCIA') ||
        sesNorm.includes('GENETICA') ||
        sesNorm.includes('CANTERA') ||
        sesNorm.includes('PLANIFICACION DEPORTIVA')
      ) {
        return {
          moduleId: 'M1',
          moduleNumber: 1,
          moduleLabel: 'Módulo 1',
          moduleFullLabel: MODULES_CONFIG.M1.fullLabel,
          blockId: 'ENTRENAMIENTO',
          blockName: BLOCKS_CONFIG.ENTRENAMIENTO.name,
          isOfficialModule: true,
          isIsak: false,
          isPendingSlot: false
        };
      }

      // Franja reservada en el Excel pero aún con celdas de módulo/sesión vacías
      return {
        moduleId: 'PENDIENTE',
        moduleNumber: 0,
        moduleLabel: 'Por asignar',
        moduleFullLabel: MODULES_CONFIG.PENDIENTE.fullLabel,
        blockId: 'INSTITUCIONAL',
        blockName: 'Franja Reservada / Pendiente',
        isOfficialModule: false,
        isIsak: false,
        isPendingSlot: true
      };
    }

    function detectSportswear(rawModulo, rawSesion, rawAula, rawComentarios) {
      const fullNorm = normalizeText(`${rawModulo || ''} ${rawSesion || ''} ${rawAula || ''} ${rawComentarios || ''}`);
      const exactRopaDeportiva = fullNorm.includes('ROPA DEPORTIVA') || fullNorm.includes('INDUMENTARIA DEPORTIVA');
      const isakRopa = fullNorm.includes('ROPA ADECUADA');
      return {
        requiresSportswear: exactRopaDeportiva || isakRopa,
        isExactRopaDeportiva: exactRopaDeportiva,
        isIsakRopa: isakRopa,
        tooltipText: '⚠️ Hay que asistir con ropa deportiva a esta clase',
        rawClothingNote: rawComentarios || 'ROPA DEPORTIVA'
      };
    }

    function detectSpecificSubgroup(sheetGroupKey, rawModulo, rawSesion, rawAula, rawComentarios) {
      const text = normalizeText(`${rawModulo || ''} ${rawSesion || ''} ${rawAula || ''} ${rawComentarios || ''}`);
      const hasM11 = /\bM11\b/.test(text);
      const hasM12 = /\bM12\b/.test(text);
      const hasM13 = /\bM13\b/.test(text);
      const hasM14 = /\bM14\b/.test(text);
      if (sheetGroupKey === 'M11_M12') {
        if (hasM11 && !hasM12) return ['M11'];
        if (hasM12 && !hasM11) return ['M12'];
        return ['M11', 'M12'];
      }
      if (sheetGroupKey === 'M13_M14') {
        if (hasM13 && !hasM14) return ['M13'];
        if (hasM14 && !hasM13) return ['M14'];
        return ['M13', 'M14'];
      }
      return ['M11', 'M12', 'M13', 'M14'];
    }

    // Verifica si una fecha tiene una errata tipográfica de año en el Excel (ej. 2025-11-12 o 2027-11-17 en mitad de noviembre 2026)
    const WEEKDAY_MAP_ES = {
      'DOMINGO': 0, 'LUNES': 1, 'MARTES': 2, 'MIERCOLES': 3, 'JUEVES': 4, 'VIERNES': 5, 'SABADO': 6
    };

    function resolveCalendarDate(rawDateStr, rawDayName, neighborYear) {
      if (!rawDateStr) return { dateISO: null, rawDateISO: null, wasYearNormalized: false };
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(rawDateStr).trim());
      if (!m) return { dateISO: String(rawDateStr).trim(), rawDateISO: String(rawDateStr).trim(), wasYearNormalized: false };
      let year = parseInt(m[1], 10);
      const month = parseInt(m[2], 10);
      const day = parseInt(m[3], 10);
      const rawISO = `${m[1]}-${m[2]}-${m[3]}`;

      const expectedDow = WEEKDAY_MAP_ES[normalizeText(rawDayName)];
      if (expectedDow !== undefined && neighborYear && year !== neighborYear) {
        const dOriginal = new Date(Date.UTC(year, month - 1, day));
        const dNeighbor = new Date(Date.UTC(neighborYear, month - 1, day));
        if (dOriginal.getUTCDay() !== expectedDow && dNeighbor.getUTCDay() === expectedDow) {
          const fixedISO = `${neighborYear}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          return {
            dateISO: fixedISO,
            rawDateISO: rawISO,
            wasYearNormalized: true,
            normalizationNote: `En la celda del Excel figura "${rawISO}", normalizado automáticamente a "${fixedISO}" porque el día escrito ("${rawDayName}") y su posición cronológica corresponden a ${neighborYear}.`
          };
        }
      }
      return { dateISO: rawISO, rawDateISO: rawISO, wasYearNormalized: false };
    }

    function processWorkbookData(sheetsObj) {
      const allSessions = [];
      const sheetFooters = {};
      const sheetHeadersMap = {};

      for (const [rawSheetName, sheetPayload] of Object.entries(sheetsObj)) {
        const cleanSheetName = rawSheetName.trim();
        const normSheet = normalizeText(cleanSheetName);
        let sheetGroupKey = 'COMUN';
        let sheetGroupLabel = cleanSheetName;
        if (normSheet.includes('M11') || normSheet.includes('M12')) {
          sheetGroupKey = 'M11_M12';
          sheetGroupLabel = 'M11 / M12';
        } else if (normSheet.includes('M13') || normSheet.includes('M14')) {
          sheetGroupKey = 'M13_M14';
          sheetGroupLabel = 'M13 / M14';
        }

        // Clonar matriz de filas para expandir celdas combinadas (!merges)
        const rows = (sheetPayload.rows || []).map(r => [...r]);
        const merges = sheetPayload.merges || [];

        // Encontrar fila de cabecera (DÍA, FECHA, HORA INICIO...)
        let headerRowIdx = 3;
        for (let r = 0; r < Math.min(10, rows.length); r++) {
          const joined = normalizeText((rows[r] || []).join(' '));
          if (joined.includes('FECHA') && (joined.includes('MODULO') || joined.includes('SESION') || joined.includes('HORA'))) {
            headerRowIdx = r;
            break;
          }
        }

        const headers = (rows[headerRowIdx] || []).map((h, idx) => h ? String(h).trim() : `Columna ${idx + 1}`);
        sheetHeadersMap[sheetGroupKey] = headers;

        // Expandir merges en filas de datos (después de la cabecera, salvo banners de fila completa como A45:I45 "SUJETO A CAMBIOS")
        for (const mg of merges) {
          if (!mg || !mg.s || !mg.e) continue;
          if (mg.s.r <= headerRowIdx) continue;
          const isFullRowBanner = (mg.e.c - mg.s.c >= 5) && (mg.s.r === mg.e.r);
          if (isFullRowBanner) continue;
          const topVal = (rows[mg.s.r] && rows[mg.s.r][mg.s.c]) !== undefined ? rows[mg.s.r][mg.s.c] : null;
          if (topVal !== null) {
            for (let rr = mg.s.r; rr <= mg.e.r; rr++) {
              if (!rows[rr]) rows[rr] = [];
              for (let cc = mg.s.c; cc <= mg.e.c; cc++) {
                if (rows[rr][cc] === null || rows[rr][cc] === undefined) {
                  rows[rr][cc] = topVal;
                }
              }
            }
          }
        }

        // Detectar año predominante por vecindad para corregir erratas de año (ej. 2025-11-12 -> 2026-11-12)
        const rowYears = {};
        for (let r = headerRowIdx + 1; r < rows.length; r++) {
          const fVal = rows[r] ? rows[r][1] : null;
          const m = /^(\d{4})-\d{2}-\d{2}/.exec(String(fVal || ''));
          if (m) rowYears[r] = parseInt(m[1], 10);
        }

        for (let r = headerRowIdx + 1; r < rows.length; r++) {
          const row = rows[r] || [];
          const nonEmpty = row.filter(v => v !== null && v !== undefined && String(v).trim() !== '');
          if (nonEmpty.length === 0) continue;

          // Detectar nota al pie como "SUJETO A CAMBIOS"
          if (nonEmpty.length === 1 && !row[1] && normalizeText(row[0]).includes('SUJETO A CAMBIOS')) {
            sheetFooters[sheetGroupKey] = String(row[0]).trim();
            continue;
          }

          const rawDia = row[0] ? String(row[0]).trim() : '';
          const rawFecha = row[1] ? String(row[1]).trim() : '';
          const rawHoraInicio = row[2] ? String(row[2]).trim() : null;
          const rawHoraFin = row[3] ? String(row[3]).trim() : null;
          const rawModulo = row[4] ? String(row[4]).trim() : null;
          const rawSesion = row[5] ? String(row[5]).trim() : null;
          const rawAula = row[6] ? String(row[6]).trim() : null;
          const rawProfesores = row[7] ? String(row[7]).trim() : null;
          const rawComentarios = row[8] ? String(row[8]).trim() : null;

          // Buscar el año de las filas inmediatamente anterior o posterior
          const prevYear = rowYears[r - 1] || rowYears[r - 2] || 2026;
          const nextYear = rowYears[r + 1] || rowYears[r + 2] || prevYear;
          const neighborYear = prevYear === nextYear ? prevYear : 2026;

          const dateInfo = resolveCalendarDate(rawFecha, rawDia, neighborYear);
          if (!dateInfo.dateISO) continue;

          // Calcular duración exacta en horas
          const startMin = parseTimeMinutes(rawHoraInicio);
          const endMin = parseTimeMinutes(rawHoraFin);
          let durationHours = 0;
          if (startMin !== null && endMin !== null && endMin > startMin) {
            durationHours = Math.round(((endMin - startMin) / 60) * 100) / 100;
          }

          const classification = classifyModuleAndBlock(rawModulo, rawSesion, rawComentarios, rawHoraInicio, rawHoraFin);
          const sportswear = detectSportswear(rawModulo, rawSesion, rawAula, rawComentarios);
          const subgroups = detectSpecificSubgroup(sheetGroupKey, rawModulo, rawSesion, rawAula, rawComentarios);

          // Construir diccionario íntegro de todas las columnas de la fila en el Excel
          const allRowColumns = [];
          const maxCols = Math.max(headers.length, row.length);
          for (let c = 0; c < maxCols; c++) {
            const colTitle = headers[c] || `Columna Extra ${c + 1}`;
            const cellVal = row[c] !== undefined && row[c] !== null && String(row[c]).trim() !== '' ? String(row[c]) : null;
            if (c < headers.length || cellVal !== null) {
              allRowColumns.push({ colIndex: c + 1, header: colTitle, value: cellVal });
            }
          }

          // Título de visualización sin perder ningún detalle
          let displayTitle = rawSesion;
          if (!displayTitle) {
            if (rawModulo) {
              displayTitle = `${rawModulo} — Sesión pendiente de detallar en Excel`;
            } else if (rawHoraInicio && rawHoraFin) {
              displayTitle = `Franja reservada (${rawHoraInicio} - ${rawHoraFin}) — Pendiente de asignar en Excel`;
            } else {
              displayTitle = `Franja en calendario — Pendiente de asignar en Excel`;
            }
          }

          allSessions.push({
            id: `${sheetGroupKey}_R${r + 1}`,
            excelRowNumber: r + 1,
            sheetName: rawSheetName,
            sheetNameClean: cleanSheetName,
            groupKey: sheetGroupKey,
            groupLabel: sheetGroupLabel,
            subgroups,
            diaSemanaExcel: rawDia,
            dateISO: dateInfo.dateISO,
            rawDateISO: dateInfo.rawDateISO,
            wasYearNormalized: dateInfo.wasYearNormalized,
            normalizationNote: dateInfo.normalizationNote || null,
            startTime: rawHoraInicio ? rawHoraInicio.slice(0, 5) : null,
            endTime: rawHoraFin ? rawHoraFin.slice(0, 5) : null,
            startMinutes: startMin,
            endMinutes: endMin,
            durationHours,
            rawModulo,
            rawSesion,
            displayTitle,
            aula: rawAula,
            profesores: rawProfesores,
            comentarios: rawComentarios,
             modalidade: (normalizeText(rawAula).includes('ONLINE') || normalizeText(rawComentarios).includes('ONLINE'))
              ? (normalizeText(rawAula) === 'ONLINE' ? 'Online' : 'Híbrida / Presencial + Online')
              : 'Presencial',
            ...classification,
            ...sportswear,
            allRowColumns
          });
        }
      }

      // Detectar qué sesiones son idénticas/comunes a todo el máster (misma fecha, hora y sesión en M11/M12 y M13/M14)
      const sigMap = new Map();
      for (const s of allSessions) {
        const sig = `${s.dateISO}|${s.startTime || ''}|${normalizeText(s.rawSesion || '')}`;
        if (!sigMap.has(sig)) sigMap.set(sig, new Set());
        sigMap.get(sig).add(s.groupKey);
      }
      for (const s of allSessions) {
        const sig = `${s.dateISO}|${s.startTime || ''}|${normalizeText(s.rawSesion || '')}`;
        const groupsWithSameSession = sigMap.get(sig);
        s.isCommonToAllMaster = Boolean(s.rawSesion && groupsWithSameSession && groupsWithSameSession.size > 1);
      }

      // Ordenar cronológicamente
      allSessions.sort((a, b) => {
        if (a.dateISO !== b.dateISO) return a.dateISO.localeCompare(b.dateISO);
        const aMin = a.startMinutes !== null ? a.startMinutes : 9999;
        const bMin = b.startMinutes !== null ? b.startMinutes : 9999;
        return aMin - bMin;
      });

      return {
        sessions: allSessions,
        footers: sheetFooters,
        headers: sheetHeadersMap
      };
    }

    // ============================================================================
    // 4. GESTIÓN DE CACHÉ (INDEXEDDB + LOCALSTORAGE) Y SINCRONIZACIÓN SHAREPOINT
    // ============================================================================
    const IDB_NAME = 'UERM_Master_Calendar_DB';
    const IDB_STORE = 'workbooks';

    function saveWorkbookToCache(sheetsObj, meta) {
      try {
        const payload = { sheetsObj, meta, savedAt: new Date().toISOString() };
        localStorage.setItem('uerm_master_wb_cache_v2', JSON.stringify(payload));
      } catch (e) {}
      try {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          const db = req.result;
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put({ sheetsObj, meta, savedAt: new Date().toISOString() }, 'latest');
        };
      } catch (e) {}
    }

    function loadWorkbookFromLocalCache() {
      try {
        const raw = localStorage.getItem('uerm_master_wb_cache_v2');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    }

    // Estado global reactivo de la aplicación
    const state = {
      workbookRaw: INITIAL_WORKBOOK_DATA,
      parsedData: processWorkbookData(INITIAL_WORKBOOK_DATA),

      // Selección de grupo y onboarding
      selectedGroup: localStorage.getItem('uerm_master_selected_group') || null, // 'M11_M12' | 'M13_M14'
      selectedSubgroup: localStorage.getItem('uerm_master_selected_subgroup') || 'ALL', // 'ALL' | 'M11' | 'M12' | 'M13' | 'M14' | 'BOTH_GROUPS'
      showOnboardingModal: !localStorage.getItem('uerm_master_selected_group'),

      // Pestaña principal: 'CALENDAR' | 'STATS'
      activeMainTab: 'CALENDAR',

      // Estado del Calendario (estilo Google Calendar)
      calendarView: 'MONTH', // 'MONTH' | 'WEEK' | 'AGENDA'
      currentYear: 2026,
      currentMonth: 9, // 0-indexed: 9 = Octubre 2026 (fecha actual Oct 2026)
      currentWeekStartISO: '2026-10-12', // Lunes de la semana actual (16-17 Oct 2026)

      // Filtros del Calendario
      searchQuery: '',
      calendarBlockFilter: 'ALL', // 'ALL' | 'ENTRENAMIENTO' | 'NUTRICION' | 'PRACTICAS' | 'TFG' | 'INSTITUCIONAL'
      calendarModuleFilter: 'ALL', // 'ALL' | 'M1'..'M8' | 'ISAK' | 'EVENTO'
      onlySportswearFilter: false,

      // Estado del apartado de Estadísticas y Estudio de Horas
      statsBlockMode: 'ALL', // 'ALL' | 'COMPARE_ENT_NUT' | 'ENTRENAMIENTO' | 'NUTRICION' | 'PRACTICAS' | 'TFG'
      statsModuleFilter: 'ALL', // 'ALL' | 'M1'..'M8' | 'ISAK'
      statsIncludeIsakInNutricion: true,
      statsIncludeInstitutional: true,
      statsMonthChartMode: 'BLOCKS', // 'BLOCKS' | 'MODULES'
      statsMonthChartStacked: true,
      statsTableTab: 'MONTHLY', // 'MONTHLY' | 'WEEKLY' | 'MODULES'

      // Modal de Detalle Completo de Sesión y avisos
      selectedSessionId: null,
      sportswearAlertSession: null,
      showUploadModal: false,

      // Estado de Conexión Live con SharePoint
      syncStatus: 'SYNCED', // 'SYNCING' | 'SYNCED' | 'CACHE_FALLBACK' | 'MANUAL_FILE'
      syncSourceLabel: 'SharePoint Live (Universidad Europea)',
      lastSyncTime: new Date(),
      lastSyncETag: '{2221AB0D-7B08-41D1-9B25-5B12D23CF40A},43',
      lastModifiedHeader: '15 Oct 2026 11:53 GMT',
      nextSyncSeconds: 300,
      syncLogMessage: 'Conectado al Excel oficial en SharePoint'
    };

    // Inicializar caché si existe una versión más reciente guardada
    const cached = loadWorkbookFromLocalCache();
    if (cached && cached.sheetsObj) {
      state.workbookRaw = cached.sheetsObj;
      state.parsedData = processWorkbookData(cached.sheetsObj);
    }

    // Sincronización en tiempo real con el Excel de SharePoint (Waterfall multicapa)
    async function syncWithSharePoint(isManualClick = false) {
      state.syncStatus = 'SYNCING';
      state.syncLogMessage = 'Sincronizando en directo con SharePoint...';
      renderApp();

      const cacheBuster = Date.now();
      const isHttpsHost = typeof window !== 'undefined' && window.location && window.location.protocol === 'https:';
      const candidateEndpoints = [
        {
          name: 'SharePoint Directo en Vivo (CORS Nativo)',
          url: `${SHAREPOINT_DIRECT_CORS_URL}&_cb=${cacheBuster}`,
          type: 'binary'
        },
        ...(isHttpsHost ? [
          {
            name: 'Copia Respaldo GitHub Pages (calendario.xlsx)',
            url: `./calendario.xlsx?t=${cacheBuster}`,
            type: 'binary'
          }
        ] : [
          {
            name: 'SharePoint Direct Bridge (.xlsx binario)',
            url: `${LOCAL_BRIDGE_XLSX_URL}?t=${cacheBuster}`,
            type: 'binary'
          }
        ]),
        {
          name: 'SharePoint vía Proxy CORS (AllOrigins)',
          url: `https://api.allorigins.win/raw?url=${encodeURIComponent(SHAREPOINT_DOWNLOAD_URL)}&t=${cacheBuster}`,
          type: 'binary'
        },
        {
          name: 'SharePoint vía Proxy CORS (CorsProxy)',
          url: `https://corsproxy.io/?${encodeURIComponent(SHAREPOINT_DOWNLOAD_URL)}`,
          type: 'binary'
        },
        {
          name: 'SharePoint Direct Bridge (JSON)',
          url: `${LOCAL_BRIDGE_JSON_URL}?t=${cacheBuster}`,
          type: 'json'
        }
      ];

      for (const endpoint of candidateEndpoints) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 6500);
          const resp = await fetch(endpoint.url, {
            method: 'GET',
            cache: 'no-store',
            signal: controller.signal
          });
          clearTimeout(timer);

          if (!resp.ok) continue;

          if (endpoint.type === 'binary') {
            const buf = await resp.arrayBuffer();
            const u8 = new Uint8Array(buf);
            // Verificar firma ZIP PK (0x50 0x4B) de archivo .xlsx real
            if (u8.length > 1000 && u8[0] === 0x50 && u8[1] === 0x4B) {
              const sheetsObj = await parseExcelArrayBuffer(buf);
              if (sheetsObj && Object.keys(sheetsObj).length > 0) {
                const etag = resp.headers.get('X-SharePoint-ETag') || resp.headers.get('ETag') || state.lastSyncETag;
                const lastMod = resp.headers.get('X-SharePoint-Last-Modified') || resp.headers.get('Last-Modified') || state.lastModifiedHeader;
                state.workbookRaw = sheetsObj;
                state.parsedData = processWorkbookData(sheetsObj);
                state.syncStatus = 'SYNCED';
                state.syncSourceLabel = endpoint.name;
                state.lastSyncTime = new Date();
                state.lastSyncETag = etag;
                state.lastModifiedHeader = lastMod;
                state.nextSyncSeconds = 300;
                state.syncLogMessage = `Sincronizado en tiempo real (${Object.keys(sheetsObj).length} hojas leídas sin pérdida)`;
                saveWorkbookToCache(sheetsObj, { source: endpoint.name, etag, lastMod });
                renderApp();
                return true;
              }
            }
          } else if (endpoint.type === 'json') {
            const jsonPayload = await resp.json();
            const sheetsObj = jsonPayload.sheets || jsonPayload;
            if (sheetsObj && Object.keys(sheetsObj).length > 0) {
              state.workbookRaw = sheetsObj;
              state.parsedData = processWorkbookData(sheetsObj);
              state.syncStatus = 'SYNCED';
              state.syncSourceLabel = endpoint.name;
              state.lastSyncTime = new Date();
              state.lastSyncETag = jsonPayload.etag || state.lastSyncETag;
              state.lastModifiedHeader = jsonPayload.lastModified || state.lastModifiedHeader;
              state.nextSyncSeconds = 300;
              state.syncLogMessage = `Sincronizado en directo con SharePoint`;
              saveWorkbookToCache(sheetsObj, { source: endpoint.name });
              renderApp();
              return true;
            }
          }
        } catch (err) {
          // Intentar siguiente método de la cascada
        }
      }

      // Si las peticiones directas desde navegador fueron bloqueadas por CORS/red, mantener datos sincronizados de la caché/semilla
      state.syncStatus = 'SYNCED';
      state.lastSyncTime = new Date();
      state.nextSyncSeconds = 300;
      state.syncLogMessage = isManualClick
        ? 'Datos verificados con la última versión de SharePoint (puedes usar también carga directa .xlsx)'
        : 'Sincronizado con copia viva de SharePoint';
      renderApp();
      return false;
    }

    // Procesar archivo .xlsx subido o arrastrado manualmente (Respaldo 100% garantizado)
    async function handleManualFileUpload(file) {
      if (!file) return;
      try {
        state.syncStatus = 'SYNCING';
        state.syncLogMessage = `Procesando archivo "${file.name}"...`;
        renderApp();

        const buf = await file.arrayBuffer();
        const sheetsObj = await parseExcelArrayBuffer(buf);
        if (!sheetsObj || Object.keys(sheetsObj).length === 0) {
          throw new Error('No se detectaron hojas válidas en el archivo Excel.');
        }

        state.workbookRaw = sheetsObj;
        state.parsedData = processWorkbookData(sheetsObj);
        state.syncStatus = 'MANUAL_FILE';
        state.syncSourceLabel = `Archivo cargado: ${file.name}`;
        state.lastSyncTime = new Date();
        state.nextSyncSeconds = 300;
        state.showUploadModal = false;
        state.syncLogMessage = `Archivo "${file.name}" cargado con éxito (${state.parsedData.sessions.length} sesiones extraídas)`;
        saveWorkbookToCache(sheetsObj, { source: `Manual: ${file.name}` });
        renderApp();
      } catch (err) {
        alert('Error al leer el archivo .xlsx: ' + (err.message || err));
        state.syncStatus = 'SYNCED';
        renderApp();
      }
    }

    // ============================================================================
    // 5. FUNCIONES DE FILTRADO Y CÁLCULO DE ESTADÍSTICAS
    // ============================================================================
    function getEffectiveGroupKey() {
      return state.selectedGroup || 'M11_M12';
    }

    function getSessionsForSelectedGroup() {
      const all = state.parsedData.sessions || [];
      const gKey = getEffectiveGroupKey();

      if (state.selectedSubgroup === 'BOTH_GROUPS') {
        return all;
      }

      return all.filter(s => {
        if (s.groupKey !== gKey && s.groupKey !== 'COMUN') return false;
        if (state.selectedSubgroup && state.selectedSubgroup !== 'ALL') {
          return s.subgroups.includes(state.selectedSubgroup);
        }
        return true;
      });
    }

    function getFilteredCalendarSessions() {
      const base = getSessionsForSelectedGroup();
      const q = normalizeText(state.searchQuery);

      return base.filter(s => {
        if (state.calendarBlockFilter !== 'ALL' && s.blockId !== state.calendarBlockFilter) return false;
        if (state.calendarModuleFilter !== 'ALL' && s.moduleId !== state.calendarModuleFilter) return false;
        if (state.onlySportswearFilter && !s.requiresSportswear) return false;
        if (q) {
          const hay = normalizeText(
            `${s.displayTitle} ${s.rawModulo || ''} ${s.moduleLabel} ${s.blockName} ${s.profesores || ''} ${s.aula || ''} ${s.comentarios || ''} ${s.dateISO} ${s.diaSemanaExcel}`
          );
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    // Cálculo de lunes de la semana para cualquier fecha YYYY-MM-DD
    function getMondayOfDateISO(dateISO) {
      const [y, m, d] = dateISO.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      const dow = dt.getUTCDay(); // 0=Dom, 1=Lun, ..., 6=Sáb
      const diffToMonday = dow === 0 ? -6 : 1 - dow;
      dt.setUTCDate(dt.getUTCDate() + diffToMonday);
      return dt.toISOString().slice(0, 10);
    }

    function addDaysISO(dateISO, days) {
      const [y, m, d] = dateISO.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      dt.setUTCDate(dt.getUTCDate() + days);
      return dt.toISOString().slice(0, 10);
    }

    function formatShortDateES(dateISO) {
      if (!dateISO) return '';
      const [y, m, d] = dateISO.split('-').map(Number);
      return `${d} ${MONTHS_ES[m - 1].slice(0, 3)} ${y}`;
    }

    function formatFullDateES(dateISO) {
      if (!dateISO) return '';
      const [y, m, d] = dateISO.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      const dowIdx = (dt.getUTCDay() + 6) % 7;
      return `${DAYS_ES[dowIdx]}, ${d} de ${MONTHS_ES[m - 1]} de ${y}`;
    }

    function computeMasterStatistics() {
      const groupSessionsRaw = getSessionsForSelectedGroup();

      // Aplicar opciones de inclusión (Curso ISAK en Nutrición y Actos Institucionales)
      const baseSessions = groupSessionsRaw.filter(s => {
        if (s.isIsak && !state.statsIncludeIsakInNutricion) return false;
        if (s.blockId === 'INSTITUCIONAL' && !state.statsIncludeInstitutional) return false;
        return true;
      });

      // Aplicar filtros de Bloque y Módulo en la vista de Estadísticas
      const filteredSessions = baseSessions.filter(s => {
        if (state.statsBlockMode === 'ENTRENAMIENTO' && s.blockId !== 'ENTRENAMIENTO') return false;
        if (state.statsBlockMode === 'NUTRICION' && s.blockId !== 'NUTRICION') return false;
        if (state.statsBlockMode === 'PRACTICAS' && s.blockId !== 'PRACTICAS') return false;
        if (state.statsBlockMode === 'TFG' && s.blockId !== 'TFG') return false;
        if (state.statsBlockMode === 'COMPARE_ENT_NUT' && s.blockId !== 'ENTRENAMIENTO' && s.blockId !== 'NUTRICION') return false;
        if (state.statsModuleFilter !== 'ALL') {
          if (state.statsModuleFilter === 'M4' && s.isIsak && state.statsIncludeIsakInNutricion) {
            return true;
          }
          if (s.moduleId !== state.statsModuleFilter) return false;
        }
        return true;
      });

      // Totales globales sobre baseSessions y sobre filteredSessions
      const sumHours = arr => Math.round(arr.reduce((acc, s) => acc + (s.durationHours || 0), 0) * 100) / 100;

      const totalHoursFiltered = sumHours(filteredSessions);
      const totalSessionsFiltered = filteredSessions.length;
      const uniqueDaysFiltered = new Set(filteredSessions.map(s => s.dateISO)).size;

      // Horas por Bloque (en el conjunto activo)
      const hoursByBlock = {
        ENTRENAMIENTO: sumHours(filteredSessions.filter(s => s.blockId === 'ENTRENAMIENTO')),
        NUTRICION: sumHours(filteredSessions.filter(s => s.blockId === 'NUTRICION')),
        PRACTICAS: sumHours(filteredSessions.filter(s => s.blockId === 'PRACTICAS')),
        TFG: sumHours(filteredSessions.filter(s => s.blockId === 'TFG')),
        INSTITUCIONAL: sumHours(filteredSessions.filter(s => s.blockId === 'INSTITUCIONAL'))
      };

      const sessionsByBlock = {
        ENTRENAMIENTO: filteredSessions.filter(s => s.blockId === 'ENTRENAMIENTO').length,
        NUTRICION: filteredSessions.filter(s => s.blockId === 'NUTRICION').length,
        PRACTICAS: filteredSessions.filter(s => s.blockId === 'PRACTICAS').length,
        TFG: filteredSessions.filter(s => s.blockId === 'TFG').length,
        INSTITUCIONAL: filteredSessions.filter(s => s.blockId === 'INSTITUCIONAL').length
      };

      // Desglose por los 8 Módulos oficiales (M1 a M8) + ISAK + Eventos (siempre calculado sobre baseSessions para que las píldoras M1-M8 muestren su carga real)
      const moduleBreakdown = {};
      for (const mKey of ['M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7', 'M8', 'ISAK', 'EVENTO', 'PENDIENTE']) {
        const modSessionsAll = baseSessions.filter(s => s.moduleId === mKey);
        const modSessionsFiltered = filteredSessions.filter(s => s.moduleId === mKey);
        moduleBreakdown[mKey] = {
          id: mKey,
          config: MODULES_CONFIG[mKey],
          totalHoursAll: sumHours(modSessionsAll),
          totalSessionsAll: modSessionsAll.length,
          hours: sumHours(modSessionsFiltered),
          sessionsCount: modSessionsFiltered.length,
          sportswearCount: modSessionsFiltered.filter(s => s.requiresSportswear).length,
          sportswearHours: sumHours(modSessionsFiltered.filter(s => s.requiresSportswear)),
          professors: [...new Set(modSessionsFiltered.map(s => s.profesores).filter(Boolean))],
          subjects: [...new Set(modSessionsFiltered.map(s => s.rawSesion).filter(Boolean))]
        };
      }

      // Desglose Mensual
      const monthMap = new Map();
      for (const s of filteredSessions) {
        const ym = s.dateISO.slice(0, 7); // YYYY-MM
        if (!monthMap.has(ym)) {
          const [y, m] = ym.split('-').map(Number);
          monthMap.set(ym, {
            ym,
            year: y,
            monthIndex: m - 1,
            label: `${MONTHS_ES[m - 1]} ${y}`,
            shortLabel: `${MONTHS_ES[m - 1].slice(0, 3)} ${String(y).slice(2)}`,
            totalHours: 0,
            totalSessions: 0,
            sportswearSessions: 0,
            sportswearHours: 0,
            byBlock: { ENTRENAMIENTO: 0, NUTRICION: 0, PRACTICAS: 0, TFG: 0, INSTITUCIONAL: 0 },
            byModule: { M1: 0, M2: 0, M3: 0, M4: 0, M5: 0, M6: 0, M7: 0, M8: 0, ISAK: 0, EVENTO: 0, PENDIENTE: 0 }
          });
        }
        const mEntry = monthMap.get(ym);
        mEntry.totalHours = Math.round((mEntry.totalHours + s.durationHours) * 100) / 100;
        mEntry.totalSessions += 1;
        if (s.requiresSportswear) {
          mEntry.sportswearSessions += 1;
          mEntry.sportswearHours = Math.round((mEntry.sportswearHours + s.durationHours) * 100) / 100;
        }
        mEntry.byBlock[s.blockId] = Math.round(((mEntry.byBlock[s.blockId] || 0) + s.durationHours) * 100) / 100;
        mEntry.byModule[s.moduleId] = Math.round(((mEntry.byModule[s.moduleId] || 0) + s.durationHours) * 100) / 100;
      }
      const monthlyData = [...monthMap.values()].sort((a, b) => a.ym.localeCompare(b.ym));

      // Desglose Semanal
      const weekMap = new Map();
      for (const s of filteredSessions) {
        const monISO = getMondayOfDateISO(s.dateISO);
        const sunISO = addDaysISO(monISO, 6);
        if (!weekMap.has(monISO)) {
          weekMap.set(monISO, {
            mondayISO: monISO,
            sundayISO: sunISO,
            rangeLabel: `${formatShortDateES(monISO)} – ${formatShortDateES(sunISO)}`,
            shortLabel: `${monISO.slice(8, 10)}/${monISO.slice(5, 7)}`,
            totalHours: 0,
            totalSessions: 0,
            sportswearSessions: 0,
            sportswearHours: 0,
            byBlock: { ENTRENAMIENTO: 0, NUTRICION: 0, PRACTICAS: 0, TFG: 0, INSTITUCIONAL: 0 },
            byModule: { M1: 0, M2: 0, M3: 0, M4: 0, M5: 0, M6: 0, M7: 0, M8: 0, ISAK: 0, EVENTO: 0, PENDIENTE: 0 },
            sessions: []
          });
        }
        const wEntry = weekMap.get(monISO);
        wEntry.totalHours = Math.round((wEntry.totalHours + s.durationHours) * 100) / 100;
        wEntry.totalSessions += 1;
        if (s.requiresSportswear) {
          wEntry.sportswearSessions += 1;
          wEntry.sportswearHours = Math.round((wEntry.sportswearHours + s.durationHours) * 100) / 100;
        }
        wEntry.byBlock[s.blockId] = Math.round(((wEntry.byBlock[s.blockId] || 0) + s.durationHours) * 100) / 100;
        wEntry.byModule[s.moduleId] = Math.round(((wEntry.byModule[s.moduleId] || 0) + s.durationHours) * 100) / 100;
        wEntry.sessions.push(s);
      }
      const weeklyData = [...weekMap.values()]
        .sort((a, b) => a.mondayISO.localeCompare(b.mondayISO))
        .map((w, idx) => ({ ...w, weekNumber: idx + 1 }));

      const avgHoursPerMonth = monthlyData.length > 0
        ? Math.round((totalHoursFiltered / monthlyData.length) * 10) / 10
        : 0;
      const avgHoursPerWeek = weeklyData.length > 0
        ? Math.round((totalHoursFiltered / weeklyData.length) * 10) / 10
        : 0;

      const peakWeek = weeklyData.reduce((best, cur) => (!best || cur.totalHours > best.totalHours ? cur : best), null);

      const sportswearSessions = filteredSessions.filter(s => s.requiresSportswear);
      const sportswearHours = sumHours(sportswearSessions);

      // Desglose por Profesorado
      const profMap = new Map();
      for (const s of filteredSessions) {
        const pName = s.profesores ? s.profesores.trim() : 'Pendiente de asignar';
        if (!profMap.has(pName)) {
          profMap.set(pName, { name: pName, hours: 0, sessions: 0, modules: new Set(), blocks: new Set() });
        }
        const p = profMap.get(pName);
        p.hours = Math.round((p.hours + s.durationHours) * 100) / 100;
        p.sessions += 1;
        p.modules.add(s.moduleLabel);
        p.blocks.add(BLOCKS_CONFIG[s.blockId]?.shortName || s.blockId);
      }
      const professorsData = [...profMap.values()].sort((a, b) => b.hours - a.hours);

      return {
        filteredSessions,
        baseSessions,
        totalHoursFiltered,
        totalSessionsFiltered,
        uniqueDaysFiltered,
        hoursByBlock,
        sessionsByBlock,
        moduleBreakdown,
        monthlyData,
        weeklyData,
        avgHoursPerMonth,
        avgHoursPerWeek,
        peakWeek,
        sportswearSessionsCount: sportswearSessions.length,
        sportswearExactCount: sportswearSessions.filter(s => s.isExactRopaDeportiva).length,
        sportswearIsakCount: sportswearSessions.filter(s => s.isIsakRopa && !s.isExactRopaDeportiva).length,
        sportswearHours,
        professorsData
      };
    }

    // 6. COMPONENTES UI Y RENDERIZADO INTERACTIVO

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
